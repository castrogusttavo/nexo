name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: castrogusttavo/nexo

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run migrations
        run: |
          docker run --rm \
            --network nexo_default \
            -e DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@nexo-db-1:5432/${{ secrets.POSTGRES_DB }}" \
            -v ${{ github.workspace }}/prisma:/app/prisma \
            -w /app \
            node:20-alpine \
            sh -c "npm i -g prisma && prisma migrate deploy --schema=/app/prisma/schema.prisma"

  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://nexo.coodee.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=https://nexo.coodee.dev
          secrets: |
            hugeicons_token=${{ secrets.HUGEICONS_TOKEN }}

      - name: Deploy to server
        run: |
          cp docker-compose.yml /var/www/nexo/docker-compose.yml
          cd /var/www/nexo/
          docker compose pull
          docker compose up -d
          docker image prune -f
