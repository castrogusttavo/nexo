name: Storage Migration (MinIO → Silo)

# One-off, manually triggered migration of the object storage container.
#
# MinIO archived its open-source project and then withdrew every public image
# and binary, so the server is running an image nobody can pull again. Silo is
# a maintained AGPL fork of the same server: same on-disk format, same
# command, same env vars (verified locally against the exact image in use,
# including bucket policies and presigned URLs).
#
# The self-hosted runner lives on the same machine as production, which is why
# this is a workflow rather than a script someone pastes into a shell: every
# run leaves a log of what was inspected, backed up, stopped and started.
#
# Modes, in the order they are meant to be used:
#   inspect  — read-only. Prints the container, image, mounts, ports and env
#              names, the data size and the free disk space. Changes nothing.
#   migrate  — backs the data up, swaps the container, verifies, and rolls
#              back by itself if verification fails.
#   rollback — puts the previous image back, as long as it is still on disk.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect (read-only), migrate, or rollback'
        required: true
        default: inspect
        type: choice
        options: [inspect, migrate, rollback]
      container:
        description: 'Name of the storage container'
        required: true
        default: nexo-minio
        type: string
      remove_old_image:
        description: 'After a verified migration, delete the old image from the server'
        required: false
        default: false
        type: boolean

env:
  SILO_IMAGE: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  BACKUP_DIR: /var/backups/nexo

jobs:
  storage:
    name: ${{ inputs.mode }}
    runs-on: self-hosted
    steps:
      - name: Inspect the running storage container
        id: inspect
        run: |
          set -euo pipefail
          NAME='${{ inputs.container }}'

          if ! docker inspect "$NAME" > /dev/null 2>&1; then
            echo "::error::No container named $NAME on this machine."
            docker ps --format '  {{.Names}} | {{.Image}}'
            exit 1
          fi

          IMAGE=$(docker inspect "$NAME" --format '{{.Config.Image}}')
          STATE=$(docker inspect "$NAME" --format '{{.State.Status}}')
          RESTART=$(docker inspect "$NAME" --format '{{.HostConfig.RestartPolicy.Name}}')
          CMD=$(docker inspect "$NAME" --format '{{join .Config.Cmd " "}}')
          NETWORK=$(docker inspect "$NAME" --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}')
          COMPOSE=$(docker inspect "$NAME" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')
          SERVICE=$(docker inspect "$NAME" --format '{{index .Config.Labels "com.docker.compose.service"}}')

          echo "container:        $NAME ($STATE, restart=$RESTART)"
          echo "image:            $IMAGE"
          echo "command:          $CMD"
          echo "networks:         $NETWORK"
          echo "compose file:     ${COMPOSE:-<none: started outside compose>}"
          echo "compose service:  ${SERVICE:-<none>}"
          echo 'mounts:'
          docker inspect "$NAME" --format '{{range .Mounts}}  {{.Type}} {{.Name}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
          echo 'ports:'
          docker inspect "$NAME" --format '{{range $p, $c := .NetworkSettings.Ports}}  {{$p}} -> {{range $c}}{{.HostIp}}:{{.HostPort}}{{end}}{{"\n"}}{{end}}'
          # Names only: the values are the storage root credentials.
          echo 'env (names only):'
          docker inspect "$NAME" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | sed 's/^/  /'

          DATA_DIR=$(docker inspect "$NAME" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}')
          echo "data on host:     ${DATA_DIR:-<not mounted at /data>}"
          if [ -n "$DATA_DIR" ]; then
            echo "data size:        $(du -sh "$DATA_DIR" 2>/dev/null | cut -f1)"
            echo "free on that fs:  $(df -h "$DATA_DIR" | awk 'NR==2 {print $4}')"
          fi

          {
            echo "name=$NAME"
            echo "image=$IMAGE"
            echo "data_dir=$DATA_DIR"
            echo "compose=$COMPOSE"
            echo "service=$SERVICE"
          } >> "$GITHUB_OUTPUT"

      - name: Back up the data directory
        if: ${{ inputs.mode == 'migrate' }}
        id: backup
        run: |
          set -euo pipefail
          DATA_DIR='${{ steps.inspect.outputs.data_dir }}'
          if [ -z "$DATA_DIR" ]; then
            echo '::error::No /data mount found; refusing to migrate blind.'
            exit 1
          fi

          # A tar of the live directory is a crash-consistent copy, not a
          # quiesced one, so the container is stopped *before* it is taken.
          docker stop '${{ steps.inspect.outputs.name }}'

          mkdir -p '${{ env.BACKUP_DIR }}'
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          ARCHIVE="${{ env.BACKUP_DIR }}/minio-pre-silo-$STAMP.tar.gz"

          NEEDED=$(du -sk "$DATA_DIR" | cut -f1)
          FREE=$(df -k "${{ env.BACKUP_DIR }}" | awk 'NR==2 {print $4}')
          echo "data: ${NEEDED}K   free: ${FREE}K"
          if [ "$FREE" -lt "$NEEDED" ]; then
            echo '::error::Not enough free space for a backup. Nothing was changed.'
            docker start '${{ steps.inspect.outputs.name }}'
            exit 1
          fi

          tar -czf "$ARCHIVE" -C "$(dirname "$DATA_DIR")" "$(basename "$DATA_DIR")"
          echo "archive:  $ARCHIVE ($(du -sh "$ARCHIVE" | cut -f1))"
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Swap the container for Silo
        if: ${{ inputs.mode == 'migrate' }}
        run: |
          set -euo pipefail
          NAME='${{ steps.inspect.outputs.name }}'
          COMPOSE='${{ steps.inspect.outputs.compose }}'
          SERVICE='${{ steps.inspect.outputs.service }}'

          docker pull '${{ env.SILO_IMAGE }}'

          if [ -n "$COMPOSE" ] && [ -f "${COMPOSE%%:*}" ]; then
            FILE="${COMPOSE%%:*}"
            echo "==> rewriting the image in $FILE (a .bak copy is kept next to it)"
            cp "$FILE" "$FILE.bak"
            sed -i "s#image: .*minio/minio:.*#image: ${{ env.SILO_IMAGE }}#" "$FILE"
            grep -n 'image:' "$FILE"
            docker compose -f "$FILE" up -d "$SERVICE"
          else
            echo '::error::The container was not started by compose; migrate it by hand.'
            docker start "$NAME"
            exit 1
          fi

      - name: Verify, and roll back if it does not answer
        if: ${{ inputs.mode == 'migrate' }}
        run: |
          set -uo pipefail
          NAME='${{ steps.inspect.outputs.name }}'

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" -eq 1 ]; then
            echo '==> health endpoint answers on the host'
            # The chain customers actually use: nginx -> container. A container
            # that answers on localhost while the vhost does not is still an
            # outage, and that is the half a local check cannot see.
            #
            # `--resolve` points the public hostname at the loopback instead of
            # trusting DNS: this machine cannot reach its own public IP (no NAT
            # hairpin), so a plain request to storage.nexopm.com fails here for
            # reasons that have nothing to do with the service — which is
            # exactly what rolled the first attempt back.
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --resolve storage.nexopm.com:443:127.0.0.1 \
              https://storage.nexopm.com/minio/health/live) || code='000'
            echo "==> nginx vhost storage.nexopm.com -> $code"
            if [ "$code" != '200' ]; then
              echo '::error::The public endpoint does not answer 200 — rolling back.'
              ok=0
            fi
          fi

          if [ "$ok" -eq 1 ]; then
            docker exec "$NAME" mc alias set check http://127.0.0.1:9000 \
              "$(docker inspect "$NAME" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MINIO_ROOT_USER=//p')" \
              "$(docker inspect "$NAME" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MINIO_ROOT_PASSWORD=//p')" > /dev/null 2>&1
            echo '==> buckets visible to the new server:'
            docker exec "$NAME" mc ls check 2>&1 | sed 's/^/    /'
            docker exec "$NAME" mc alias remove check > /dev/null 2>&1 || true
            docker logs --tail 15 "$NAME"
            exit 0
          fi

          echo '::error::Silo did not answer in 60s — rolling back to the previous image.'
          FILE='${{ steps.inspect.outputs.compose }}'
          FILE="${FILE%%:*}"
          if [ -f "$FILE.bak" ]; then
            mv "$FILE.bak" "$FILE"
            docker compose -f "$FILE" up -d '${{ steps.inspect.outputs.service }}'
          fi
          docker logs --tail 40 "$NAME"
          exit 1

      - name: Roll back to the previous image
        if: ${{ inputs.mode == 'rollback' }}
        run: |
          set -euo pipefail
          FILE='${{ steps.inspect.outputs.compose }}'
          FILE="${FILE%%:*}"
          if [ ! -f "$FILE.bak" ]; then
            echo "::error::No $FILE.bak to restore."
            exit 1
          fi
          mv "$FILE.bak" "$FILE"
          docker compose -f "$FILE" up -d '${{ steps.inspect.outputs.service }}'
          docker ps --filter "name=${{ steps.inspect.outputs.name }}" --format '  {{.Names}} | {{.Image}} | {{.Status}}'

      # Deliberately last, and opt-in: the old image cannot be pulled again by
      # anyone, so deleting it is the one step of this migration that cannot be
      # undone.
      - name: Delete the withdrawn MinIO image
        if: ${{ inputs.mode == 'migrate' && inputs.remove_old_image }}
        run: |
          set -euo pipefail
          OLD='${{ steps.inspect.outputs.image }}'
          RUNNING=$(docker inspect '${{ steps.inspect.outputs.name }}' --format '{{.Config.Image}}')
          if [ "$RUNNING" = "$OLD" ]; then
            echo "::error::Storage is still running $OLD. Not deleting it."
            exit 1
          fi
          docker rmi "$OLD"
          echo "==> images left on this machine:"
          docker images --format '  {{.Repository}}:{{.Tag}} ({{.Size}})' | grep -iE 'silo|minio' || echo '  (none)'
