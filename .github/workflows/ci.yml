name: CI

on:
  push:
    branches: [main]
    # Root-level docs only (README, CONTRIBUTING, ...): markdown under the
    # app tree is rendered content and must still build and deploy.
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm biome lint --error-on-warnings

  # Static checks of public/openapi.json against the routes, ERROR_CODES,
  # proxy.ts and the Zod schemas. No Postgres/Redis/server: the suite only
  # reads files, so it gets its own fast job instead of waiting on the
  # coverage-tests services.
  contract-tests:
    name: OpenAPI Contract Tests
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm test:contract --run

  e2e-tests:
    name: E2E Tests (API + Browser)
    runs-on: avrea-ubuntu-latest-2-vcpu
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/nexo_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-not-real
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: 'true'
      # Shared by the server and the test process so the secret-checked routes
      # (status collector, payment webhook) accept the requests the e2e tests send.
      STATUS_COLLECTOR_SECRET: ci-status-collector-secret
      ABACATE_PAY_WEBHOOK_SECRET: ci-abacate-webhook-secret
      # Same reasoning: the /admin/careers e2e suite signs up a user with this
      # exact address to exercise the authorized path of the platform-admin allowlist.
      PLATFORM_ADMIN_EMAILS: e2e-admin@example.com
      # The queue console mounts basic auth from these. Without them the route
      # refuses to mount at all (see its comment), so the suite would be
      # asserting the refusal instead of the dashboard it means to cover.
      WORKBENCH_USER: ci-workbench
      WORKBENCH_PASS: ci-workbench-password
      # `next start` runs in production mode, where better-auth's built-in rate
      # limiter is on and would 429 the suite's repeated sign-ups. The app keeps
      # its own auth rate limiting; disable only better-auth's here.
      DISABLE_AUTH_RATE_LIMIT: 'true'
      MAIL_DRY_RUN: 'true'
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_USER: ci-minio-user
      MINIO_PASSWORD: ci-minio-password
      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # and SKIP_ENV_VALIDATION is not (it has no NEXT_PUBLIC_ prefix), so the
      # browser re-runs lib/env/env.ts validation for real. Without these the
      # bundle throws on every page and Chromium shows "This page couldn't
      # load" -- which is exactly how production broke once before, over a
      # missing NEXT_PUBLIC_REALTIME_URL.
      NEXT_PUBLIC_AXIOM_TOKEN: xaat-ci-token-not-real
      NEXT_PUBLIC_AXIOM_DATASET: nexo-ci
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:1234
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Push database schema
        run: pnpm prisma db push

      # services: can't pass a custom command to the minio/minio image
      # (it needs `server /data` or it exits immediately), so it's started
      # the same way as the redis-tls-smoke job's Redis container: a plain
      # docker run + a wait loop, instead of the declarative `services:` block.
      #
      # The image is Silo, a maintained AGPL fork of the MinIO server: MinIO
      # archived the open-source repository and then withdrew its public
      # distribution entirely — quay.io/minio/minio answers 401 for every tag,
      # Docker Hub denies access and dl.min.io is 410 — which broke this job
      # overnight with no change of ours. Silo is a drop-in: same command, same
      # env vars, same `/minio/health/live` endpoint the wait loop below uses,
      # and it reads a data directory written by the old server unchanged
      # (verified against the exact image this replaces).
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-minio-password \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data

      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done
          echo "MinIO failed to start"
          exit 1

      - name: Restore Next.js build cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'src/**', 'lib/**', 'utils/**', 'hooks/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The only `next build` in CI: also serves as the build check (a
      # standalone build job used to compile the app a second time).
      - name: Build application
        # Avrea runners export NODE_OPTIONS=--use-openssl-ca, which Node rejects
        # for worker threads, crashing next build's workers.
        run: pnpm build
        env:
          NODE_OPTIONS: ''

      - name: Start server
        run: pnpm start &
        env:
          PORT: 3000
          NODE_OPTIONS: ''

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run e2e tests
        run: pnpm test:e2e

      # The browser suite reuses this job's build, database and MinIO instead
      # of paying for a second `next build`. It boots its own server (the
      # standalone artifact production runs), so the `next start` above has to
      # let go of the port first.
      - name: Stop the API test server
        run: |
          # `pnpm start &` leaves a next-server child, so match the port, not
          # the command name, and wait for it to actually let go.
          fuser -k 3000/tcp 2>/dev/null || true
          for i in $(seq 1 20); do
            if ! curl -s --max-time 2 http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Port 3000 is free"
              exit 0
            fi
            sleep 1
          done
          echo "Something is still listening on port 3000"
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts also boots the realtime server (Hocuspocus,
      # `pnpm realtime:build && node dist/realtime.cjs`) for the wiki editor
      # specs. It reads this job's env: it listens on NEXT_PUBLIC_REALTIME_URL's
      # port (1234, the URL baked into the build above), authenticates with
      # BETTER_AUTH_SECRET against DATABASE_URL, and uses the plain-TCP Redis
      # service (REDIS_TLS_ENABLED is unset, so no TLS).
      - name: Run browser tests
        run: pnpm test:browser
        env:
          PLAYWRIGHT_SKIP_BUILD: 'true'
          NODE_OPTIONS: ''

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Visual regression runs inside the official Playwright image so the
      # baselines are rasterised the same way here and on a developer's
      # machine, and reuses this job's build, database and MinIO. It comes
      # after the browser suite because both want port 3000.
      - name: Run visual regression tests
        run: ./e2e/visual/run-in-docker.sh --output=test-results-visual
        env:
          PLAYWRIGHT_SKIP_BUILD: 'true'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
          NODE_OPTIONS: ''

      - name: Upload visual diff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-visual
          path: playwright-report-visual/
          retention-days: 7

  # Single run of unit + integration (with coverage, uploaded to Codecov) and
  # component tests. Separate unit/integration jobs used to repeat the exact
  # same suites without coverage.
  coverage-tests:
    name: Unit, Integration & Component Tests
    runs-on: avrea-ubuntu-latest-2-vcpu
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/nexo_test
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Push database schema
        run: pnpm prisma db push

      - name: Run unit + integration tests with coverage
        run: pnpm test:coverage

      - name: Run component tests with coverage
        run: pnpm test:coverage:component

      # Two uploads under separate flags so the frontend number (still being
      # built up) never drags the backend's down — see codecov.yml.
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: backend
          disable_search: true

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/frontend/lcov.info
          flags: frontend
          disable_search: true

  # TEMPORARY (2026-07-15): `pnpm audit` hits the npm registry's legacy audit
  # endpoints, which npm retired today (410 Gone) in favor of a bulk-advisory
  # endpoint pnpm doesn't speak yet on a stable release (only on the 11.0.0
  # RC, which pnpm's own supply-chain trust check currently refuses to
  # install here as a downgrade — see pnpm/pnpm#10202 for the same class of
  # false positive). continue-on-error on the step (not the job — that would
  # still leave the job itself reporting failure) + out of the gate's needs,
  # same pattern as the snyk job below, so this outage doesn't block deploys
  # or show up as a failing check. Revert both once pnpm ships a stable
  # release that supports the new endpoint, restoring this as a required,
  # blocking check.
  audit:
    name: Dependency Audit
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      # `pnpm audit` reads pnpm-lock.yaml only, so no install/cache is needed.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=critical
        continue-on-error: true

  # Monitoring only: uploads SARIF to the Security tab but is intentionally kept
  # out of the gate's needs (and continue-on-error), so a flaky snyk@master run
  # or a high-severity finding doesn't block deploys. Critical dep vulns are
  # still blocked by the audit job.
  snyk:
    name: Snyk Security Scan
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk test
        uses: snyk/actions/node@8e119fbb6c251787721d34ba683ed48eba792766 # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

  semgrep:
    name: Semgrep SAST
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One scan, two outputs: SARIF for the Security tab, JSON for the
      # lpa2v-triage job (which used to run the same scan a second time).
      - name: Run Semgrep
        run: semgrep scan --config auto --config p/nextjs --config p/react --config p/typescript --sarif-output=semgrep.sarif --json-output=semgrep.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep JSON for triage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-json
          path: semgrep.json
          retention-days: 1

      - name: Upload Semgrep SARIF to GitHub
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Monitoring/triage layer on top of the semgrep + snyk jobs above: correlates
  # their raw findings (SAST + SCA only here — DAST isn't available on every
  # push, see lpa2v-triage-full in security-dast.yml for the 3-domain version)
  # through the LPA2v paraconsistent cluster to cut alert noise before a human
  # looks at it. Kept out of the gate's needs while we build trust in it,
  # same posture as the snyk job: it opens/updates a review Issue and only
  # fails this job itself on a "critico" verdict, never blocks the deploy.
  lpa2v-triage:
    name: LPA2v Contextual Triage (SAST+SCA)
    needs: [semgrep]
    runs-on: avrea-ubuntu-latest-2-vcpu
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout nexo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout lpa2v-appsec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: castrogusttavo/lpa2v-appsec
          path: .lpa2v-appsec

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: .lpa2v-appsec/pnpm-lock.yaml

      - name: Install lpa2v-appsec dependencies
        working-directory: .lpa2v-appsec
        run: pnpm install --frozen-lockfile

      - name: Download Semgrep JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semgrep-json

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install nexo dependencies (for snyk --all-projects)
        run: pnpm install --frozen-lockfile

      - name: Run Snyk (JSON output)
        run: npx snyk test --all-projects --json > snyk.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run LPA2v triage
        id: triage
        working-directory: .lpa2v-appsec
        run: |
          pnpm triage -- \
            --semgrep ../semgrep.json \
            --snyk ../snyk.json \
            --out ../triage-results.json \
            --issue-body ../triage-issue.md

      - name: Upload triage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lpa2v-triage-results
          path: |
            triage-results.json
            triage-issue.md

      - name: Open or update review Issue
        if: always() && steps.triage.outputs.needs_review == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('triage-issue.md', 'utf-8');
            const title = 'LPA2v: achados pendentes de revisão';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'lpa2v-triage',
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['lpa2v-triage', 'security'],
              });
            }

  redis-tls-smoke:
    name: Redis TLS Smoke
    runs-on: avrea-ubuntu-latest-2-vcpu
    env:
      REDIS_URL: rediss://:testpassword@localhost:6379
      REDIS_PASSWORD: testpassword
      REDIS_TLS_ENABLED: 'true'
      REDIS_TLS_CA_PATH: ${{ github.workspace }}/redis-tls/ca.crt
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TLS certificates
        run: bash redis-tls/generate.sh

      - name: Start Redis with TLS
        run: |
          docker run -d --name redis-tls \
            -p 6379:6379 \
            -v "$PWD/redis-tls:/opt/bitnami/redis/certs:ro" \
            -e REDIS_PASSWORD=testpassword \
            -e REDIS_TLS_ENABLED=yes \
            -e REDIS_TLS_PORT_NUMBER=6379 \
            -e REDIS_PORT_NUMBER=0 \
            -e REDIS_TLS_CERT_FILE=/opt/bitnami/redis/certs/redis.crt \
            -e REDIS_TLS_KEY_FILE=/opt/bitnami/redis/certs/redis.key \
            -e REDIS_TLS_CA_FILE=/opt/bitnami/redis/certs/ca.crt \
            -e REDIS_TLS_AUTH_CLIENTS=no \
            bitnami/redis:latest

      - name: Wait for Redis TLS to be ready
        run: |
          for i in {1..30}; do
            if docker exec redis-tls redis-cli --tls \
                --cacert /opt/bitnami/redis/certs/ca.crt \
                -a testpassword ping 2>/dev/null | grep -q PONG; then
              echo "Redis TLS is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Redis TLS failed to become ready"
          docker logs redis-tls
          exit 1

      - name: Run Redis TLS smoke test
        run: pnpm vitest --project redis-tls --run

  gitleaks:
    name: Secret Scan
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: PR Title Convention
    if: github.event_name == 'pull_request'
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title is a conventional commit
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: CI Gate
    needs:
      - lint
      - contract-tests
      - e2e-tests
      - coverage-tests
      - semgrep
      - gitleaks
      - redis-tls-smoke
    if: always()
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs did not pass:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: All required checks passed
        run: echo "CI gate green."

  notify-slack:
    name: Notify Slack on Failure
    needs: [gate]
    if: failure()
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Prepare notification context
        id: ctx
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: |
          first_line="${COMMIT_MSG%%$'\n'*}"
          escaped=$(printf '%s' "$first_line" | sed 's/\\/\\\\/g; s/"/\\"/g')
          echo "commit_msg=$escaped" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "CI failed: ${{ github.workflow }} on ${{ steps.ctx.outputs.branch }}",
              "attachments": [
                {
                  "color": "#dc2626",
                  "fallback": "CI failed on ${{ steps.ctx.outputs.branch }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": { "type": "mrkdwn", "text": "*CI failed*" }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Workflow*\n${{ github.workflow }}" },
                        { "type": "mrkdwn", "text": "*Branch*\n`${{ steps.ctx.outputs.branch }}`" },
                        { "type": "mrkdwn", "text": "*Author*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ steps.ctx.outputs.short_sha }}`> ${{ steps.ctx.outputs.commit_msg }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "Open failed run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
