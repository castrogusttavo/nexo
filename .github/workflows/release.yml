name: Release

# Creates a GitHub Release for manually-pushed CalVer tags (YYYY.MM.DD[.N]).
# Tags created by the CD pipeline use GITHUB_TOKEN, which does not trigger other
# workflows, so the CD creates its own release; this workflow covers human/PAT
# tag pushes.
on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
