name: Server Ops

# Narrow, auditable access to the production host for the things that live
# outside this repository: the infrastructure compose file and the backup
# script. The self-hosted runner is on that machine, so every action leaves a
# log of what was read or changed.
#
# Modes are deliberately specific rather than "run this command". Read-only
# ones come first and are the default.
#
#   compose-diff    — prints the server's infra compose next to this repo's
#                     and diffs them. Changes nothing.
#   backup-inspect  — prints the backup script (credentials redacted), its
#                     cron entry, the most recent log and the rclone remote
#                     names. Changes nothing.
#   backup-run      — runs the backup script now and reports what it produced,
#                     locally and on Backblaze B2.
#   cleanup-bak     — removes the *.bak the storage migration left behind.
#   compose-export  — uploads the server's infra compose as an artifact, so it
#                     can be reviewed and then versioned in this repository.
#   infra-apply     — installs this repository's production infra compose and
#                     brings the stack to match it.
#   app-up          — brings the application stack (app, worker, realtime) back
#                     up from docker-compose.yml, without a rebuild.
#   replication-prepare — creates the replicator role and the pg_hba rule on
#                     the live primary, so a replica can clone it. Idempotent,
#                     and does not restart Postgres.
#   replication-status — asks the primary whether a standby is actually
#                     streaming, and how far behind it is.
#   db-pool-status  — how many connections Postgres allows, who is holding
#                     them, and what pgbouncer is doing with them.
#   env-sync        — rewrites the server's .env from sops and restarts the
#                     application containers, without waiting for a full
#                     build-and-deploy. Same source of truth, sooner.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do on the server'
        required: true
        default: compose-diff
        type: choice
        options: [compose-diff, backup-inspect, backup-run, cleanup-bak, compose-export, infra-apply, app-up, replication-prepare, replication-status, db-pool-status, env-sync]

env:
  SERVER_DIR: /var/www/nexo
  BACKUP_SCRIPT: /usr/local/sbin/nexo-backup.sh

jobs:
  ops:
    name: ${{ inputs.mode }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare the server's infra compose with this repository's
        if: ${{ inputs.mode == 'compose-diff' }}
        run: |
          set -uo pipefail
          FILE='${{ env.SERVER_DIR }}/docker-compose.infra.yml'
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist."
            exit 1
          fi

          echo "==> services and images on the server"
          grep -nE '^  [a-z0-9_-]+:|image:|container_name:' "$FILE" || true

          echo
          echo '==> services and images in this repository (production file)'
          grep -nE '^  [a-z0-9_-]+:|image:|container_name:' infra/prod.yml || true

          echo
          echo '==> diff (server -> repository)'
          # Values are redacted: the server file carries real credentials in
          # environment blocks, and this log is readable by anyone with access
          # to the Actions tab.
          redact() { sed -E 's/(PASSWORD|SECRET|KEY|TOKEN|USER)([A-Z_]*): *.+/\1\2: <redacted>/I; s/(:[^ ]*@)/:<redacted>@/g'; }
          # Against the production file, not the development one: they are
          # different stacks on purpose (dev has a replica and a pgbouncer),
          # and diffing the wrong pair reports 125 lines of noise.
          diff -u <(redact < "$FILE") <(redact < infra/prod.yml) &&
            echo '  (identical)'

          echo
          echo '==> leftovers from the storage migration'
          ls -la '${{ env.SERVER_DIR }}'/*.bak 2>/dev/null || echo '  (none)'

          echo
          echo '==> what is actually running'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

      - name: Inspect the backup setup
        if: ${{ inputs.mode == 'backup-inspect' }}
        run: |
          set -uo pipefail
          echo "==> ${{ env.BACKUP_SCRIPT }}"
          if [ -f '${{ env.BACKUP_SCRIPT }}' ]; then
            # Same redaction as above: this prints a file that may embed keys.
            sed -E 's/(PASSWORD|SECRET|KEY|TOKEN|ACCOUNT)([A-Z_]*)=.+/\1\2=<redacted>/I' '${{ env.BACKUP_SCRIPT }}'
          else
            echo '  (not found)'
          fi

          echo
          echo '==> schedule'
          crontab -l 2>/dev/null | grep -i backup || true
          ls -la /etc/cron.d/ 2>/dev/null | grep -i backup || true
          systemctl list-timers --all 2>/dev/null | grep -i backup || true

          echo
          echo '==> most recent backup artefacts on disk'
          ls -lah /var/backups/nexo/ 2>/dev/null | tail -10 || echo '  (no /var/backups/nexo)'

          echo
          echo '==> most recent log lines'
          for f in /var/log/nexo-backup.log /var/log/nexo/backup.log; do
            [ -f "$f" ] && { echo "--- $f"; tail -25 "$f"; }
          done

          echo
          echo '==> rclone remotes (names only)'
          rclone listremotes 2>/dev/null || echo '  rclone not on PATH for this user'

      - name: Run the backup now
        if: ${{ inputs.mode == 'backup-run' }}
        run: |
          set -uo pipefail
          if [ ! -x '${{ env.BACKUP_SCRIPT }}' ]; then
            echo '::error::${{ env.BACKUP_SCRIPT }} is not executable by this user.'
            exit 1
          fi

          before=$(ls -1 /var/backups/nexo/ 2>/dev/null | wc -l)
          echo "==> files in /var/backups/nexo before: $before"

          # The script is the same one cron runs; no flags, no shortcuts, so
          # what this proves is what happens at 03:15 every day.
          '${{ env.BACKUP_SCRIPT }}' 2>&1 | tail -60
          status=${PIPESTATUS[0]}
          echo "==> exit status: $status"

          echo
          echo '==> artefacts now'
          ls -lah /var/backups/nexo/ 2>/dev/null | tail -10

          echo
          echo '==> newest objects on the remote'
          for remote in $(rclone listremotes 2>/dev/null); do
            echo "--- $remote"
            rclone lsl "$remote" --max-depth 2 2>/dev/null | sort -k2 | tail -8 || true
          done

          exit "$status"

      - name: Remove the migration leftovers
        if: ${{ inputs.mode == 'cleanup-bak' }}
        run: |
          set -euo pipefail
          found=0
          for f in '${{ env.SERVER_DIR }}'/*.bak; do
            [ -e "$f" ] || continue
            found=1
            echo "  removing $f"
            rm -f "$f"
          done
          [ "$found" -eq 1 ] || echo '  nothing to remove'
          ls -la '${{ env.SERVER_DIR }}' | grep -E '\.ya?ml' || true

      # The production infra compose exists only on the server (the CD copies
      # docker-compose.yml and never this one), so it cannot be reviewed or
      # versioned without leaving the box. An artifact keeps it out of the run
      # log, which is rendered to anyone who opens the Actions tab.
      - name: Export the server's infra compose
        if: ${{ inputs.mode == 'compose-export' }}
        run: |
          set -euo pipefail
          mkdir -p exported
          cp '${{ env.SERVER_DIR }}/docker-compose.infra.yml' exported/
          echo "==> exported $(wc -l < exported/docker-compose.infra.yml) lines"
          echo '==> lines that carry a literal value instead of a ${VAR} reference:'
          grep -nE '^[[:space:]]+[A-Z_]+: *[^$[:space:]]' exported/docker-compose.infra.yml |
            sed -E 's/: .*/: <value hidden>/' || echo '  (none — every value is a reference)'

      - name: Upload it
        if: ${{ inputs.mode == 'compose-export' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-infra-compose
          path: exported/docker-compose.infra.yml
          retention-days: 1

      # Applying infrastructure is separate from deploying the app on purpose:
      # restarting Postgres or Redis is not a side effect a frontend deploy
      # should have.
      #
      # `--remove-orphans` is deliberately NOT used, and this comment is the
      # scar: both compose files in /var/www/nexo share one project name
      # (`nexo`, from the directory), so to the infra file the app, the worker
      # and the realtime server all look like orphans. Running it took
      # production down for about ninety seconds on 2026-09-24. A container
      # that should go is named explicitly below instead.
      - name: Apply the production infra compose
        if: ${{ inputs.mode == 'infra-apply' }}
        run: |
          set -euo pipefail
          TARGET='${{ env.SERVER_DIR }}/docker-compose.infra.yml'

          echo '==> what is running before'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

          cp infra/prod.yml "$TARGET"
          echo "==> installed $(wc -l < "$TARGET") lines into $TARGET"

          # The replica bind-mounts its entrypoint from ./docker, relative to
          # the compose file. The CD never copied that directory, so without
          # this the container starts and dies on a missing file.
          rsync -a --delete infra/docker/ '${{ env.SERVER_DIR }}/docker/'
          echo "==> support scripts installed:"
          find '${{ env.SERVER_DIR }}/docker' -type f | sed 's/^/    /'

          cd '${{ env.SERVER_DIR }}'
          docker compose -f docker-compose.infra.yml up -d

          # Whatever belongs to this project but is not declared by either
          # compose file is reported, never removed: deciding that a container
          # is garbage is a human's call, and the automated version of that
          # call is what caused the outage this step now avoids.
          echo
          echo '==> containers in this project that no compose file declares:'
          declared=$(docker compose -f docker-compose.infra.yml ps -a --format '{{.Name}}';
                     docker compose -f docker-compose.yml ps -a --format '{{.Name}}')
          docker ps -a --filter 'label=com.docker.compose.project=nexo' --format '{{.Names}}' |
            while read -r name; do
              grep -qx "$name" <<< "$declared" || echo "    $name"
            done

          echo
          echo '==> what is running after'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

          echo
          echo '==> the database and storage answered:'
          docker exec nexo-db-1 pg_isready -U "$(grep -m1 '^POSTGRES_USER=' .env | cut -d= -f2-)" || true
          curl -fsS -o /dev/null -w '  storage health %{http_code}\n' http://localhost:9000/minio/health/live

          echo
          echo '==> volumes still on disk (rabbitmqdata survives on purpose:'
          echo '    removing a container never removes its data)'
          docker volume ls --format '  {{.Name}}' | grep -E 'nexo_' || true

      - name: Bring the application stack up
        if: ${{ inputs.mode == 'app-up' }}
        run: |
          set -euo pipefail
          cd '${{ env.SERVER_DIR }}'
          docker compose -f docker-compose.yml up -d
          sleep 5
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'
          curl -fsS -o /dev/null -w '  app health %{http_code}\n' http://localhost:3000/api/health || true

      # Replication needs two things on the primary that only appear by
      # themselves when a Postgres volume is initialised from empty: a role
      # that may replicate, and a pg_hba line that lets it in. Production's
      # volume has carried data since January, so they are applied here.
      #
      # `pg_hba` is scoped to the docker network's own subnet, not the
      # 0.0.0.0/0 the development init script uses — that script says in its
      # own comment that it is for ephemeral local infra, and the primary
      # publishes 5432 on the host. Nothing is restarted: a reload is enough
      # for pg_hba, and the role needs no restart at all.
      - name: Prepare the primary for replication
        if: ${{ inputs.mode == 'replication-prepare' }}
        run: |
          set -euo pipefail
          cd '${{ env.SERVER_DIR }}'
          PGUSER=$(grep -m1 '^POSTGRES_USER=' .env | cut -d= -f2-)
          PGDB=$(grep -m1 '^POSTGRES_DB=' .env | cut -d= -f2-)
          REPLPW=$(grep -m1 '^REPLICATOR_PASSWORD=' .env | cut -d= -f2-)
          if [ -z "$REPLPW" ]; then
            echo '::error::REPLICATOR_PASSWORD is not in /var/www/nexo/.env yet — deploy first, the CD writes it from sops.'
            exit 1
          fi

          echo '==> settings the primary already has'
          docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -Atc \
            "SELECT name || ' = ' || setting FROM pg_settings WHERE name IN ('wal_level','max_wal_senders','max_replication_slots');" |
            sed 's/^/    /'

          echo '==> role'
          exists=$(docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -Atc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'replicator';")
          if [ "$exists" = '1' ]; then
            docker exec -e PW="$REPLPW" nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 -c \
              "ALTER ROLE replicator WITH REPLICATION LOGIN PASSWORD '$REPLPW';" > /dev/null
            echo '    replicator already existed; password re-applied'
          else
            docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -v ON_ERROR_STOP=1 -c \
              "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD '$REPLPW';" > /dev/null
            echo '    replicator created'
          fi

          echo '==> pg_hba'
          SUBNET=$(docker network inspect nexo_default --format '{{(index .IPAM.Config 0).Subnet}}')
          RULE="host    replication     replicator      $SUBNET          scram-sha-256"
          echo "    docker subnet: $SUBNET"
          if docker exec nexo-db-1 grep -qF "replication     replicator      $SUBNET" /var/lib/postgresql/data/pg_hba.conf; then
            echo '    rule already present'
          else
            docker exec nexo-db-1 bash -c "echo '$RULE' >> /var/lib/postgresql/data/pg_hba.conf"
            docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -Atc 'SELECT pg_reload_conf();' > /dev/null
            echo '    rule appended and configuration reloaded (no restart)'
          fi

          echo '==> replication rules now in pg_hba:'
          docker exec nexo-db-1 grep -E '^host +replication' /var/lib/postgresql/data/pg_hba.conf | sed 's/^/    /'

      # "The container is up" is not the same claim as "the replica has the
      # data". Only the primary can answer the second one, and it does so in
      # pg_stat_replication: a row per connected standby, with how far behind
      # it is in bytes.
      - name: Report replication status
        if: ${{ inputs.mode == 'replication-status' }}
        run: |
          set -uo pipefail
          cd '${{ env.SERVER_DIR }}'
          PGUSER=$(grep -m1 '^POSTGRES_USER=' .env | cut -d= -f2-)
          PGDB=$(grep -m1 '^POSTGRES_DB=' .env | cut -d= -f2-)

          echo '==> standbys connected to the primary'
          docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -x -c \
            "SELECT application_name, client_addr, state, sync_state,
                    pg_size_pretty(pg_wal_lsn_diff(sent_lsn, replay_lsn)) AS replay_lag
             FROM pg_stat_replication;" | sed 's/^/    /'

          echo '==> the replica answers, and knows it is a replica'
          docker exec nexo-db-replica psql -U "$PGUSER" -d "$PGDB" -Atc \
            'SELECT pg_is_in_recovery();' | sed 's/^/    in recovery: /' || echo '    (replica not answering)'

          echo '==> row counts, primary vs replica'
          for c in nexo-db-1 nexo-db-replica; do
            n=$(docker exec "$c" psql -U "$PGUSER" -d "$PGDB" -Atc \
              'SELECT count(*) FROM users;' 2>/dev/null || echo '?')
            echo "    $c: $n users"
          done

          echo '==> pgbouncer'
          docker exec nexo-pgbouncer sh -c 'nc -z 127.0.0.1 5432' 2>/dev/null &&
            echo '    listening' || echo '    not answering'

      # Connection pressure is three numbers: what Postgres allows, what the
      # application processes hold, and what pgbouncer is absorbing. Each app
      # container keeps its own pool, so the headroom is easy to lose sight of
      # from the outside.
      - name: Report connection pool pressure
        if: ${{ inputs.mode == 'db-pool-status' }}
        run: |
          set -uo pipefail
          cd '${{ env.SERVER_DIR }}'
          PGUSER=$(grep -m1 '^POSTGRES_USER=' .env | cut -d= -f2-)
          PGDB=$(grep -m1 '^POSTGRES_DB=' .env | cut -d= -f2-)

          echo '==> what the server allows'
          docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -Atc \
            "SELECT name || ' = ' || setting FROM pg_settings
             WHERE name IN ('max_connections','superuser_reserved_connections','max_wal_senders');" |
            sed 's/^/    /'

          echo '==> who is holding connections right now'
          docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -c \
            "SELECT coalesce(application_name,'(none)') AS client, state,
                    count(*) AS conns, max(now() - state_change) AS oldest
             FROM pg_stat_activity
             WHERE backend_type = 'client backend'
             GROUP BY 1, 2 ORDER BY conns DESC;" | sed 's/^/    /'

          echo '==> totals'
          docker exec nexo-db-1 psql -U "$PGUSER" -d "$PGDB" -Atc \
            "SELECT 'in use: ' || count(*) || ' of ' ||
                    current_setting('max_connections') ||
                    ' (' || round(100.0 * count(*) /
                    current_setting('max_connections')::int, 1) || '%)'
             FROM pg_stat_activity;" | sed 's/^/    /'

          echo '==> is anything going through pgbouncer'
          docker exec nexo-pgbouncer psql -h 127.0.0.1 -p 5432 -U "$PGUSER" \
            -d pgbouncer -Atc 'SHOW POOLS;' 2>/dev/null | sed 's/^/    /' ||
            echo '    (pgbouncer admin console not reachable — it is idle unless DATABASE_URL_POOLED is set)'

          echo '==> does the app route through it?'
          if grep -q '^DATABASE_URL_POOLED=' .env; then
            echo '    DATABASE_URL_POOLED is set: traffic goes through pgbouncer'
          else
            echo '    DATABASE_URL_POOLED is NOT set: every process talks to Postgres directly'
          fi
          echo -n '    DB_POOL_MAX: '
          grep -m1 '^DB_POOL_MAX=' .env | cut -d= -f2- || echo '25 (code default; not in .env)'

      # The deploy already writes this file; this does the same two steps
      # without the image build in front of them, for when a secret changed and
      # the wait is the only thing standing between a variable and a test.
      #
      # It deliberately mirrors cd.yml rather than improvising: the same sops
      # decrypt, and the same Slack webhook appended afterwards, because that
      # one lives in a GitHub secret instead of sops and would otherwise be
      # dropped every time this ran.
      - name: Sync the server environment from sops
        if: ${{ inputs.mode == 'env-sync' }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          before=$(grep -c . '${{ env.SERVER_DIR }}/.env' || echo 0)

          sops --decrypt secrets/production.enc.env > '${{ env.SERVER_DIR }}/.env'

          if [ -n "$SLACK_WEBHOOK_URL" ] &&
             ! grep -q '^SLACK_ALERTS_WEBHOOK_URL=' '${{ env.SERVER_DIR }}/.env'; then
            printf 'SLACK_ALERTS_WEBHOOK_URL=%s\n' "$SLACK_WEBHOOK_URL" >> '${{ env.SERVER_DIR }}/.env'
          fi

          after=$(grep -c . '${{ env.SERVER_DIR }}/.env')
          echo "==> .env: $before -> $after variables (names only below)"
          cut -d= -f1 '${{ env.SERVER_DIR }}/.env' | sort | tr '\n' ' ' | fold -w 100 -s | sed 's/^/    /'

          echo
          echo '==> restarting the application so it reads them'
          cd '${{ env.SERVER_DIR }}'
          docker compose -f docker-compose.yml up -d
          sleep 6
          docker ps --format '  {{.Names}} | {{.Status}}' | grep -E 'nextjs|worker|realtime'
          curl -fsS -o /dev/null -w '  app health %{http_code}\n' http://localhost:3000/api/health || true
