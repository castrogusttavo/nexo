name: Server Ops

# Narrow, auditable access to the production host for the things that live
# outside this repository: the infrastructure compose file and the backup
# script. The self-hosted runner is on that machine, so every action leaves a
# log of what was read or changed.
#
# Modes are deliberately specific rather than "run this command". Read-only
# ones come first and are the default.
#
#   compose-diff    — prints the server's infra compose next to this repo's
#                     and diffs them. Changes nothing.
#   backup-inspect  — prints the backup script (credentials redacted), its
#                     cron entry, the most recent log and the rclone remote
#                     names. Changes nothing.
#   backup-run      — runs the backup script now and reports what it produced,
#                     locally and on Backblaze B2.
#   cleanup-bak     — removes the *.bak the storage migration left behind.
#   compose-export  — uploads the server's infra compose as an artifact, so it
#                     can be reviewed and then versioned in this repository.
#   infra-apply     — installs this repository's production infra compose and
#                     brings the stack to match it.
#   app-up          — brings the application stack (app, worker, realtime) back
#                     up from docker-compose.yml, without a rebuild.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do on the server'
        required: true
        default: compose-diff
        type: choice
        options: [compose-diff, backup-inspect, backup-run, cleanup-bak, compose-export, infra-apply, app-up]

env:
  SERVER_DIR: /var/www/nexo
  BACKUP_SCRIPT: /usr/local/sbin/nexo-backup.sh

jobs:
  ops:
    name: ${{ inputs.mode }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare the server's infra compose with this repository's
        if: ${{ inputs.mode == 'compose-diff' }}
        run: |
          set -uo pipefail
          FILE='${{ env.SERVER_DIR }}/docker-compose.infra.yml'
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist."
            exit 1
          fi

          echo "==> services and images on the server"
          grep -nE '^  [a-z0-9_-]+:|image:|container_name:' "$FILE" || true

          echo
          echo '==> services and images in this repository (production file)'
          grep -nE '^  [a-z0-9_-]+:|image:|container_name:' docker-compose.infra.prod.yml || true

          echo
          echo '==> diff (server -> repository)'
          # Values are redacted: the server file carries real credentials in
          # environment blocks, and this log is readable by anyone with access
          # to the Actions tab.
          redact() { sed -E 's/(PASSWORD|SECRET|KEY|TOKEN|USER)([A-Z_]*): *.+/\1\2: <redacted>/I; s/(:[^ ]*@)/:<redacted>@/g'; }
          # Against the production file, not the development one: they are
          # different stacks on purpose (dev has a replica and a pgbouncer),
          # and diffing the wrong pair reports 125 lines of noise.
          diff -u <(redact < "$FILE") <(redact < docker-compose.infra.prod.yml) &&
            echo '  (identical)'

          echo
          echo '==> leftovers from the storage migration'
          ls -la '${{ env.SERVER_DIR }}'/*.bak 2>/dev/null || echo '  (none)'

          echo
          echo '==> what is actually running'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

      - name: Inspect the backup setup
        if: ${{ inputs.mode == 'backup-inspect' }}
        run: |
          set -uo pipefail
          echo "==> ${{ env.BACKUP_SCRIPT }}"
          if [ -f '${{ env.BACKUP_SCRIPT }}' ]; then
            # Same redaction as above: this prints a file that may embed keys.
            sed -E 's/(PASSWORD|SECRET|KEY|TOKEN|ACCOUNT)([A-Z_]*)=.+/\1\2=<redacted>/I' '${{ env.BACKUP_SCRIPT }}'
          else
            echo '  (not found)'
          fi

          echo
          echo '==> schedule'
          crontab -l 2>/dev/null | grep -i backup || true
          ls -la /etc/cron.d/ 2>/dev/null | grep -i backup || true
          systemctl list-timers --all 2>/dev/null | grep -i backup || true

          echo
          echo '==> most recent backup artefacts on disk'
          ls -lah /var/backups/nexo/ 2>/dev/null | tail -10 || echo '  (no /var/backups/nexo)'

          echo
          echo '==> most recent log lines'
          for f in /var/log/nexo-backup.log /var/log/nexo/backup.log; do
            [ -f "$f" ] && { echo "--- $f"; tail -25 "$f"; }
          done

          echo
          echo '==> rclone remotes (names only)'
          rclone listremotes 2>/dev/null || echo '  rclone not on PATH for this user'

      - name: Run the backup now
        if: ${{ inputs.mode == 'backup-run' }}
        run: |
          set -uo pipefail
          if [ ! -x '${{ env.BACKUP_SCRIPT }}' ]; then
            echo '::error::${{ env.BACKUP_SCRIPT }} is not executable by this user.'
            exit 1
          fi

          before=$(ls -1 /var/backups/nexo/ 2>/dev/null | wc -l)
          echo "==> files in /var/backups/nexo before: $before"

          # The script is the same one cron runs; no flags, no shortcuts, so
          # what this proves is what happens at 03:15 every day.
          '${{ env.BACKUP_SCRIPT }}' 2>&1 | tail -60
          status=${PIPESTATUS[0]}
          echo "==> exit status: $status"

          echo
          echo '==> artefacts now'
          ls -lah /var/backups/nexo/ 2>/dev/null | tail -10

          echo
          echo '==> newest objects on the remote'
          for remote in $(rclone listremotes 2>/dev/null); do
            echo "--- $remote"
            rclone lsl "$remote" --max-depth 2 2>/dev/null | sort -k2 | tail -8 || true
          done

          exit "$status"

      - name: Remove the migration leftovers
        if: ${{ inputs.mode == 'cleanup-bak' }}
        run: |
          set -euo pipefail
          found=0
          for f in '${{ env.SERVER_DIR }}'/*.bak; do
            [ -e "$f" ] || continue
            found=1
            echo "  removing $f"
            rm -f "$f"
          done
          [ "$found" -eq 1 ] || echo '  nothing to remove'
          ls -la '${{ env.SERVER_DIR }}' | grep -E '\.ya?ml' || true

      # The production infra compose exists only on the server (the CD copies
      # docker-compose.yml and never this one), so it cannot be reviewed or
      # versioned without leaving the box. An artifact keeps it out of the run
      # log, which is rendered to anyone who opens the Actions tab.
      - name: Export the server's infra compose
        if: ${{ inputs.mode == 'compose-export' }}
        run: |
          set -euo pipefail
          mkdir -p exported
          cp '${{ env.SERVER_DIR }}/docker-compose.infra.yml' exported/
          echo "==> exported $(wc -l < exported/docker-compose.infra.yml) lines"
          echo '==> lines that carry a literal value instead of a ${VAR} reference:'
          grep -nE '^[[:space:]]+[A-Z_]+: *[^$[:space:]]' exported/docker-compose.infra.yml |
            sed -E 's/: .*/: <value hidden>/' || echo '  (none — every value is a reference)'

      - name: Upload it
        if: ${{ inputs.mode == 'compose-export' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-infra-compose
          path: exported/docker-compose.infra.yml
          retention-days: 1

      # Applying infrastructure is separate from deploying the app on purpose:
      # restarting Postgres or Redis is not a side effect a frontend deploy
      # should have.
      #
      # `--remove-orphans` is deliberately NOT used, and this comment is the
      # scar: both compose files in /var/www/nexo share one project name
      # (`nexo`, from the directory), so to the infra file the app, the worker
      # and the realtime server all look like orphans. Running it took
      # production down for about ninety seconds on 2026-09-24. A container
      # that should go is named explicitly below instead.
      - name: Apply the production infra compose
        if: ${{ inputs.mode == 'infra-apply' }}
        run: |
          set -euo pipefail
          TARGET='${{ env.SERVER_DIR }}/docker-compose.infra.yml'

          echo '==> what is running before'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

          cp docker-compose.infra.prod.yml "$TARGET"
          echo "==> installed $(wc -l < "$TARGET") lines into $TARGET"

          cd '${{ env.SERVER_DIR }}'
          docker compose -f docker-compose.infra.yml up -d

          # Whatever belongs to this project but is not declared by either
          # compose file is reported, never removed: deciding that a container
          # is garbage is a human's call, and the automated version of that
          # call is what caused the outage this step now avoids.
          echo
          echo '==> containers in this project that no compose file declares:'
          declared=$(docker compose -f docker-compose.infra.yml ps -a --format '{{.Name}}';
                     docker compose -f docker-compose.yml ps -a --format '{{.Name}}')
          docker ps -a --filter 'label=com.docker.compose.project=nexo' --format '{{.Names}}' |
            while read -r name; do
              grep -qx "$name" <<< "$declared" || echo "    $name"
            done

          echo
          echo '==> what is running after'
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'

          echo
          echo '==> the database and storage answered:'
          docker exec nexo-db-1 pg_isready -U "$(grep -m1 '^POSTGRES_USER=' .env | cut -d= -f2-)" || true
          curl -fsS -o /dev/null -w '  storage health %{http_code}\n' http://localhost:9000/minio/health/live

          echo
          echo '==> volumes still on disk (rabbitmqdata survives on purpose:'
          echo '    removing a container never removes its data)'
          docker volume ls --format '  {{.Name}}' | grep -E 'nexo_' || true

      - name: Bring the application stack up
        if: ${{ inputs.mode == 'app-up' }}
        run: |
          set -euo pipefail
          cd '${{ env.SERVER_DIR }}'
          docker compose -f docker-compose.yml up -d
          sleep 5
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'
          curl -fsS -o /dev/null -w '  app health %{http_code}\n' http://localhost:3000/api/health || true
