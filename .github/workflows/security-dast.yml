name: Security DAST

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'https://nexo.coodee.dev'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -J zap-report.json'
          allow_issue_writing: true
          issue_title: 'OWASP ZAP Baseline Scan Report'
          fail_action: false

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report-json
          path: zap-report.json

  # Full 3-domain version of lpa2v-triage (ci.yml): here DAST evidence is
  # actually available, so this is where genuine SAST-vs-DAST contradiction
  # (e.g. a WAF-blocked exploit attempt) gets a chance to surface as
  # "inconsistente" instead of a flat false positive. Own review Issue
  # (separate label from the push-triggered job) so the two don't clobber
  # each other.
  lpa2v-triage-full:
    name: LPA2v Contextual Triage (SAST+SCA+DAST)
    needs: [zap-baseline]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout nexo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout lpa2v-appsec
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: castrogusttavo/lpa2v-appsec
          path: .lpa2v-appsec

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: .lpa2v-appsec/pnpm-lock.yaml

      - name: Install lpa2v-appsec dependencies
        working-directory: .lpa2v-appsec
        run: pnpm install --frozen-lockfile

      - name: Download ZAP JSON report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zap-report-json

      - name: Run Semgrep (JSON output)
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep \
            semgrep scan --config auto --config p/nextjs --config p/react --config p/typescript \
            --json --output=/src/semgrep.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install nexo dependencies (for snyk --all-projects)
        run: pnpm install --frozen-lockfile

      - name: Run Snyk (JSON output)
        run: npx snyk test --all-projects --json > snyk.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run LPA2v triage (full)
        id: triage
        working-directory: .lpa2v-appsec
        run: |
          pnpm triage -- \
            --semgrep ../semgrep.json \
            --snyk ../snyk.json \
            --zap ../zap-report.json \
            --out ../triage-results-full.json \
            --issue-body ../triage-issue-full.md

      - name: Upload triage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lpa2v-triage-full-results
          path: |
            triage-results-full.json
            triage-issue-full.md

      - name: Open or update review Issue
        if: always() && steps.triage.outputs.needs_review == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('triage-issue-full.md', 'utf-8');
            const title = 'LPA2v: triagem completa (SAST+SCA+DAST) — achados pendentes de revisão';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'lpa2v-triage-full',
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['lpa2v-triage-full', 'security'],
              });
            }

  headers-check:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check security headers
        run: |
          RESPONSE=$(curl -sI https://nexo.coodee.dev)
          echo "$RESPONSE"

          check_header() {
            if echo "$RESPONSE" | grep -qi "$1"; then
              echo "OK: $1"
            else
              echo "MISSING: $1" && exit 1
            fi
          }

          check_header "x-frame-options"
          check_header "x-content-type-options"
          check_header "strict-transport-security"
          check_header "content-security-policy"
          check_header "referrer-policy"

          echo "All security headers present."
