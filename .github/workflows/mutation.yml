name: mutation

# Mutation testing answers what coverage cannot: whether a broken line would
# actually fail a test. It takes ~25 minutes, and the score moves slowly, so
# it runs weekly and on demand instead of inside the CI gate -- cd.yml deploys
# off a successful CI run, and folding this in would delay every deploy.
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # prisma.config.ts resolves DATABASE_URL on load, even for `prisma
      # generate`, which never connects. The mutated code runs against mocks,
      # so the URL only has to exist; the first manual run died here before
      # Stryker even started.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # The self-hosted runner's bundled npm is broken, so pnpm comes from
      # corepack -- same reason as the migrations job in cd.yml.
      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Configure HugeIcons registry
        run: |
          echo "@hugeicons-pro:registry=https://npm.hugeicons.com" > .npmrc
          echo "//npm.hugeicons.com/:_authToken=${{ secrets.HUGEICONS_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The mutated services import @prisma/client types.
      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run mutation tests
        run: pnpm test:mutation
        env:
          SKIP_ENV_VALIDATION: 'true'

      - name: Upload mutation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: .stryker/reports/
          retention-days: 30
