coverage:
  status:
    # Bloqueia se a cobertura do projeto cair em relação à base (sem cravar um número).
    # Per flag: backend (unit + integration) and frontend (component) are
    # judged against their own baseline, so the young frontend suite never
    # drags the backend's number down.
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        flags: [backend]
      frontend:
        target: auto
        threshold: 1%
        if_ci_failed: error
        flags: [frontend]
    # Cobre o código novo/alterado do PR. Só conta arquivos dentro do `include`
    # do vite.config (services, mappers, schemas, repositories, cache, etc.).
    patch:
      default:
        target: 70%
        threshold: 5%
        flags: [backend]
      # Informational until the frontend suite catches up: reports new
      # client code without tests, doesn't fail the status.
      frontend:
        target: 70%
        informational: true
        flags: [frontend]

flag_management:
  default_rules:
    # A run that uploads only one flag keeps the other's last report.
    carryforward: true

comment:
  layout: 'reach, diff, flags, files'
  require_changes: true

# Route handlers are only exercised by e2e (separate `next start` process),
# which v8 can't instrument — they'd always show as uncovered here.
ignore:
  - 'app/api/**'
