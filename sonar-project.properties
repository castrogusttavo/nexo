# Template inicial — ajuste projectKey/organization para os valores reais do
# seu projeto no SonarCloud antes de definir o SONAR_TOKEN.
sonar.projectKey=castrogusttavo_nexo
sonar.organization=castrogusttavo

sonar.sources=app,src,worker,lib,utils
sonar.exclusions=**/__tests__/**,src/generated/**,**/*.config.*,public/**,**/*.test.ts

# Reaproveita o lcov do job de coverage, quando presente.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
