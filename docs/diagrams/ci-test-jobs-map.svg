<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Which CI job runs which tests</text>
<text x="40" y="84" font-size="19" fill="#475569">Eight jobs feed the gate; the coverage jobs also feed Codecov; mutation testing runs weekly, outside the gate.</text>
