<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 760" width="2000" height="760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The proxy that never shipped, and the CSP behind it</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="760" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">The proxy that never shipped, and the CSP behind it</text>
<text x="40" y="84" font-size="19" fill="#475569">proxy.ts sat in .dockerignore for about six months (inferred); putting it back alone would have blocked every script.</text>
<line x1="60" y1="300" x2="1940" y2="300" stroke="#94A3B8" stroke-width="3"/>
<circle cx="250" cy="300" r="11" fill="#5B54D6"/>
<text x="250" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">2026-03-15</text>
<text x="250" y="360" text-anchor="middle" font-size="15" fill="#475569" font-family="monospace">54a2123d</text>
<rect x="60" y="140" width="380" height="110" rx="8" fill="#4A5568"/>
<text x="250.0" y="185.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Dockerignore</text>
<text x="250.0" y="211.0" text-anchor="middle" font-size="15" fill="#fff">proxy.ts added to .dockerignore</text>
<path d="M250,250 L250,286" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<circle cx="790" cy="300" r="11" fill="#5B54D6"/>
<text x="790" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">2026-09-20 15:04</text>
<text x="790" y="360" text-anchor="middle" font-size="15" fill="#475569" font-family="monospace">1d3f61bb</text>
<rect x="600" y="140" width="380" height="110" rx="8" fill="#4A5568"/>
<text x="790.0" y="175.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Proxy restored</text>
<text x="790.0" y="201.0" text-anchor="middle" font-size="15" fill="#fff">proxy.ts back; script-src self +</text>
<text x="790.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">unsafe-inline; contract test</text>
<path d="M790,250 L790,286" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<circle cx="1230" cy="300" r="11" fill="#5B54D6"/>
<text x="1230" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">2026-09-20 15:06</text>
<text x="1230" y="360" text-anchor="middle" font-size="15" fill="#475569" font-family="monospace">08512633</text>
<rect x="1040" y="140" width="380" height="110" rx="8" fill="#4A5568"/>
<text x="1230.0" y="175.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Browser suite</text>
<text x="1230.0" y="201.0" text-anchor="middle" font-size="15" fill="#fff">Playwright browser suite on the</text>
<text x="1230.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">standalone build</text>
<path d="M1230,250 L1230,286" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<circle cx="1700" cy="300" r="11" fill="#5B54D6"/>
<text x="1700" y="338" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">2026-09-21</text>
<text x="1700" y="360" text-anchor="middle" font-size="15" fill="#475569" font-family="monospace">fc78ddc6, 28ceb262</text>
<rect x="1510" y="140" width="380" height="110" rx="8" fill="#4A5568"/>
<text x="1700.0" y="175.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Follow-ups</text>
<text x="1700.0" y="201.0" text-anchor="middle" font-size="15" fill="#fff">fonts moved to our origin and out</text>
<text x="1700.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">of the proxy matcher</text>
<path d="M1700,250 L1700,286" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<text x="520" y="288" text-anchor="middle" font-size="15" fill="#475569">about six months, inferred</text>
<text x="60" y="440" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">WHAT PRODUCTION SENT</text>
<rect x="60" y="465" width="640" height="150" rx="8" fill="#D1495B"/>
<text x="380.0" y="520.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">No proxy</text>
<text x="380.0" y="546.0" text-anchor="middle" font-size="15" fill="#fff">no CSP, no HSTS from the app, no edge auth gate; a</text>
<text x="380.0" y="565.0" text-anchor="middle" font-size="15" fill="#fff">private URL answered 200 to an anonymous visitor</text>
<rect x="740" y="465" width="580" height="150" rx="8" fill="#E08A3C"/>
<text x="1030.0" y="510.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Proxy with a nonce CSP (never live)</text>
<text x="1030.0" y="536.0" text-anchor="middle" font-size="15" fill="#fff">strict-dynamic makes browsers ignore self: 27</text>
<text x="1030.0" y="555.0" text-anchor="middle" font-size="15" fill="#fff">scripts blocked in Chromium against the</text>
<text x="1030.0" y="574.0" text-anchor="middle" font-size="15" fill="#fff">standalone build, nothing interactive</text>
<rect x="1360" y="465" width="580" height="150" rx="8" fill="#2F9E6E"/>
<text x="1650.0" y="520.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Final CSP</text>
<text x="1650.0" y="546.0" text-anchor="middle" font-size="15" fill="#fff">script-src 'self' 'unsafe-inline': other origins</text>
<text x="1650.0" y="565.0" text-anchor="middle" font-size="15" fill="#fff">and eval still refused; proxy.ts in the image</text>
<path d="M700,540 L740,540" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<path d="M1320,540 L1360,540" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<text x="1000" y="680" text-anchor="middle" font-size="15" fill="#475569">The second defect was latent: it could not be seen while the proxy was absent. The first hid the second.</text>
</svg>