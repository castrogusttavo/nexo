<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Background jobs and failure alarm</text>
<text x="40" y="84" font-size="19" fill="#475569">Four BullMQ queues, one worker process; every job that dies for good is reported once, by two independent paths.</text>
