<text x="1195" y="578" text-anchor="middle" font-size="15" fill="#3B37A8">completed → queue.job.completed</text>
<text x="1195" y="598" text-anchor="middle" font-size="15" fill="#3B37A8">UserCache invalidated on delete</text>
