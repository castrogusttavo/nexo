<text x="1400.0" y="780.0" text-anchor="middle" font-size="15" fill="#fff">queue.job.exhausted → monitor</text>
<text x="1400" y="824" text-anchor="middle" font-size="15" fill="#475569">the event name is a contract with the monitor</text>
