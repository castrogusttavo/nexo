<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 910" width="2000" height="910" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Private page access</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="910" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Private page access</text>
<text x="40" y="84" font-size="19" fill="#475569">The proxy only guesses from cookies; the real gate sits in the data access layer, next to the data, never in a layout.</text>
<rect x="210" y="125" width="520" height="470" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="232" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">PROXY.TS · OPTIMISTIC, NO DATABASE</text>
<rect x="235" y="170" width="210" height="80" rx="8" fill="#D1495B"/>
<text x="340.0" y="207.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">No session cookie</text>
<text x="340.0" y="230.0" text-anchor="middle" font-size="15" fill="#fff">401 for /api, else /sign-in</text>
<rect x="480" y="170" width="230" height="80" rx="8" fill="#D1495B"/>
<text x="595.0" y="207.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Terms not accepted</text>
<text x="595.0" y="230.0" text-anchor="middle" font-size="15" fill="#fff">signed cookie cache says so</text>
<rect x="40" y="400" width="140" height="100" rx="8" fill="#4A5568"/>
<text x="110.0" y="447.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Browser</text>
<text x="110.0" y="470.0" text-anchor="middle" font-size="15" fill="#fff">page GET</text>
<rect x="330" y="400" width="230" height="100" rx="8" fill="#DCDAF2"/>
<text x="445.0" y="447.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">proxy.ts</text>
<text x="445.0" y="470.0" text-anchor="middle" font-size="15" fill="#3B37A8">cookie check</text>
<path d="M180,450 L330,450" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="202.5" y="411" width="105.0" height="28" rx="14" fill="#5B54D6"/>
<text x="255" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1. request</text>
<path d="M400,400 L400,250" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="351.45" y="286" width="97.10000000000001" height="28" rx="14" fill="#D1495B"/>
<text x="400" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">no cookie</text>
<path d="M500,400 L500,250" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="427.75" y="346" width="144.5" height="28" rx="14" fill="#D1495B"/>
<text x="500" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">consent missing</text>
<text x="445" y="530" text-anchor="middle" font-size="15" fill="#475569">reads cookies only, never the database</text>
<text x="445" y="550" text-anchor="middle" font-size="15" fill="#475569">PUBLIC_ROUTES skip the check</text>
<text x="445" y="570" text-anchor="middle" font-size="15" fill="#475569">consent redirect: page GETs only</text>
<rect x="790" y="400" width="220" height="100" rx="8" fill="#DCDAF2"/>
<text x="900.0" y="447.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Server component</text>
<text x="900.0" y="470.0" text-anchor="middle" font-size="15" fill="#3B37A8">page under (private)</text>
<path d="M560,450 L790,450" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="626.45" y="411" width="97.10000000000001" height="28" rx="14" fill="#5B54D6"/>
<text x="675" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2. passes</text>
<text x="900" y="530" text-anchor="middle" font-size="15" fill="#3B37A8">getProjectContext and</text>
<text x="900" y="550" text-anchor="middle" font-size="15" fill="#3B37A8">getWikiContext call the DAL</text>
<rect x="1170" y="125" width="360" height="635" rx="14" fill="none" stroke="#5B54D6" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1192" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#3B37A8">DAL · SRC/LIB/DAL.TS</text>
<rect x="1200" y="170" width="300" height="90" rx="8" fill="#2F9E6E"/>
<text x="1350.0" y="212.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">getCurrentUser()</text>
<text x="1350.0" y="235.0" text-anchor="middle" font-size="15" fill="#fff">Better Auth session</text>
<rect x="1200" y="340" width="300" height="90" rx="8" fill="#2F9E6E"/>
<text x="1350.0" y="382.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">requireConsentedUser(res)</text>
<text x="1350.0" y="405.0" text-anchor="middle" font-size="15" fill="#fff">session + consent in Postgres</text>
<rect x="1200" y="480" width="300" height="230" rx="8" fill="#2F9E6E"/>
<text x="1350.0" y="592.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">requireMembership(slug)</text>
<text x="1350.0" y="615.0" text-anchor="middle" font-size="15" fill="#fff">session + consent + membership</text>
<text x="1350" y="290" text-anchor="middle" font-size="15" fill="#475569">use cache: private on each check</text>
<text x="1350" y="310" text-anchor="middle" font-size="15" fill="#475569">runs on every server request</text>
<text x="1350" y="458" text-anchor="middle" font-size="15" fill="#475569">client router keeps it 5 min</text>
<path d="M1110,215 L1200,215" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M1110,385 L1200,385" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M1110,595 L1200,595" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M1010,450 L1110,450" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M1110,215 L1110,595" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round"/>
<rect x="1069.35" y="436" width="81.30000000000001" height="28" rx="14" fill="#5B54D6"/>
<text x="1110" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3. call</text>
<rect x="1640" y="185" width="310" height="60" rx="8" fill="#D1495B"/>
<text x="1795.0" y="212.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">/sign-in</text>
<text x="1795.0" y="235.0" text-anchor="middle" font-size="15" fill="#fff">redirect · no session</text>
<path d="M1500,215 L1640,215" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1517.5" y="179" width="105.0" height="28" rx="14" fill="#D1495B"/>
<text x="1570" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">no session</text>
<rect x="1640" y="355" width="310" height="60" rx="8" fill="#D1495B"/>
<text x="1795.0" y="382.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">/onboarding/consent-setup</text>
<text x="1795.0" y="405.0" text-anchor="middle" font-size="15" fill="#fff">redirect · terms not accepted</text>
<path d="M1500,385 L1640,385" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1517.5" y="349" width="105.0" height="28" rx="14" fill="#D1495B"/>
<text x="1570" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">no consent</text>
<rect x="1640" y="495" width="310" height="60" rx="8" fill="#D1495B"/>
<text x="1795.0" y="522.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">onboardingDestination</text>
<text x="1795.0" y="545.0" text-anchor="middle" font-size="15" fill="#fff">redirect · onboarding unfinished</text>
<path d="M1500,525 L1640,525" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1509.6" y="491" width="120.80000000000001" height="28" rx="14" fill="#D1495B"/>
<text x="1570" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">step pending</text>
<rect x="1640" y="565" width="310" height="60" rx="8" fill="#D1495B"/>
<text x="1795.0" y="592.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">/create-workspace</text>
<text x="1795.0" y="615.0" text-anchor="middle" font-size="15" fill="#fff">redirect · no workspace yet</text>
<path d="M1500,595 L1640,595" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1509.6" y="559" width="120.80000000000001" height="28" rx="14" fill="#D1495B"/>
<text x="1570" y="578" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">no workspace</text>
<rect x="1640" y="635" width="310" height="60" rx="8" fill="#D1495B"/>
<text x="1795.0" y="662.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">404</text>
<text x="1795.0" y="685.0" text-anchor="middle" font-size="15" fill="#fff">notFound() · not a member</text>
<path d="M1500,665 L1640,665" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1509.6" y="631" width="120.80000000000001" height="28" rx="14" fill="#D1495B"/>
<text x="1570" y="650" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">not a member</text>
<rect x="1640" y="770" width="310" height="60" rx="8" fill="#2F9E6E"/>
<text x="1795.0" y="797.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Page renders</text>
<text x="1795.0" y="820.0" text-anchor="middle" font-size="15" fill="#fff">user and membership returned</text>
<path d="M1350,710 L1350,800 L1640,800" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="1474.1" y="786" width="41.8" height="28" rx="14" fill="#2F9E6E"/>
<text x="1495" y="805" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ok</text>
<text x="1795" y="862" text-anchor="middle" font-size="15" fill="#475569">access.e2e.test.ts checks every</text>
<text x="1795" y="882" text-anchor="middle" font-size="15" fill="#475569">workspace page from outside</text>
<rect x="40" y="640" width="860" height="220" rx="14" fill="none" stroke="#D1495B" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="62" y="670" font-size="15" font-weight="700" letter-spacing="1" fill="#B13A4A">REJECTED · A GATE IN A LAYOUT</text>
<rect x="70" y="700" width="220" height="80" rx="8" fill="#D1495B"/>
<text x="180.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">redirect() in layout</text>
<text x="180.0" y="760.0" text-anchor="middle" font-size="15" fill="#fff">layout.tsx</text>
<rect x="360" y="700" width="220" height="80" rx="8" fill="#D1495B"/>
<text x="470.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Children still render</text>
<text x="470.0" y="760.0" text-anchor="middle" font-size="15" fill="#fff">layouts render in parallel</text>
<rect x="650" y="700" width="220" height="80" rx="8" fill="#D1495B"/>
<text x="760.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Data in the payload</text>
<text x="760.0" y="760.0" text-anchor="middle" font-size="15" fill="#fff">a real STR-61 leak</text>
<path d="M290,740 L360,740" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<path d="M580,740 L650,740" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<text x="470" y="820" text-anchor="middle" font-size="15" fill="#475569">a layout does not re-render on navigation either</text>
<text x="470" y="842" text-anchor="middle" font-size="15" fill="#475569">so it is not a security boundary</text>
</svg>