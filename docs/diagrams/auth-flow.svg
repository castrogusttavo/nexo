<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1010" width="2000" height="1010" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Authentication flow</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="1010" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Authentication flow</text>
<text x="40" y="84" font-size="19" fill="#475569">Three ways in, one session: Better Auth creates it, proxy.ts and the DAL guard every later request.</text>
<text x="40" y="130" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">SIGN IN</text>
<rect x="40" y="160" width="230" height="80" rx="8" fill="#4A5568"/>
<text x="155.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Sign-in form</text>
<text x="155.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">email + password</text>
<rect x="360" y="160" width="300" height="80" rx="8" fill="#DCDAF2"/>
<text x="510.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">POST /sign-in/email</text>
<text x="510.0" y="220.0" text-anchor="middle" font-size="15" fill="#3B37A8">argon2 verify · e-mail verified</text>
<rect x="770" y="160" width="320" height="80" rx="8" fill="#DCDAF2"/>
<text x="930.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Two-factor challenge</text>
<text x="930.0" y="220.0" text-anchor="middle" font-size="15" fill="#3B37A8">twoFactorRedirect</text>
<path d="M270,200 L360,200" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="298.05" y="166" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="315" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<path d="M660,200 L770,200" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="698.05" y="166" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="715" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="930" y="262" text-anchor="middle" font-size="15" fill="#3B37A8">e-mailed OTP · TOTP app · backup code</text>
<text x="930" y="282" text-anchor="middle" font-size="15" fill="#3B37A8">5 failed attempts lock it for 15 min</text>
<text x="930" y="302" text-anchor="middle" font-size="15" fill="#3B37A8">trust device refused for platform admins</text>
<rect x="40" y="350" width="230" height="80" rx="8" fill="#4A5568"/>
<text x="155.0" y="387.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Google / GitHub</text>
<text x="155.0" y="410.0" text-anchor="middle" font-size="15" fill="#fff">OAuth provider</text>
<rect x="360" y="350" width="300" height="80" rx="8" fill="#DCDAF2"/>
<text x="510.0" y="387.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">OAuth callback</text>
<text x="510.0" y="410.0" text-anchor="middle" font-size="15" fill="#3B37A8">accountLinking enabled</text>
<path d="M270,390 L360,390" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<rect x="298.05" y="356" width="33.9" height="28" rx="14" fill="#3B82C4"/>
<text x="315" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<text x="510" y="452" text-anchor="middle" font-size="15" fill="#3B37A8">access / refresh / id tokens</text>
<text x="510" y="472" text-anchor="middle" font-size="15" fill="#3B37A8">encrypted at rest (XChaCha20)</text>
<rect x="40" y="520" width="230" height="80" rx="8" fill="#4A5568"/>
<text x="155.0" y="557.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Sign-up</text>
<text x="155.0" y="580.0" text-anchor="middle" font-size="15" fill="#fff">unverified e-mail</text>
<rect x="360" y="520" width="300" height="80" rx="8" fill="#DCDAF2"/>
<text x="510.0" y="557.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">emailOTP plugin</text>
<text x="510.0" y="580.0" text-anchor="middle" font-size="15" fill="#3B37A8">email-verification · sign-in</text>
<rect x="770" y="520" width="320" height="80" rx="8" fill="#DCDAF2"/>
<text x="930.0" y="557.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Code e-mailed</text>
<text x="930.0" y="580.0" text-anchor="middle" font-size="15" fill="#3B37A8">sendVerificationOTP</text>
<path d="M270,560 L360,560" fill="none" stroke="#2A9AA8" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-teal)"/>
<rect x="298.05" y="526" width="33.9" height="28" rx="14" fill="#2A9AA8"/>
<text x="315" y="545" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
<path d="M660,560 L770,560" fill="none" stroke="#2A9AA8" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-teal)"/>
<rect x="698.05" y="526" width="33.9" height="28" rx="14" fill="#2A9AA8"/>
<text x="715" y="545" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<text x="930" y="622" text-anchor="middle" font-size="15" fill="#3B37A8">autoSignInAfterVerification: true</text>
<rect x="1200" y="350" width="280" height="80" rx="8" fill="#DCDAF2"/>
<text x="1340.0" y="387.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Session created</text>
<text x="1340.0" y="410.0" text-anchor="middle" font-size="15" fill="#3B37A8">databaseHooks.session.create</text>
<path d="M1090,200 L1145,200 L1145,375 L1200,375" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1128.05" y="276" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="1145" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<path d="M660,390 L1200,390" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<rect x="913.05" y="376" width="33.9" height="28" rx="14" fill="#3B82C4"/>
<text x="930" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<path d="M1090,560 L1145,560 L1145,405 L1200,405" fill="none" stroke="#2A9AA8" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-teal)"/>
<rect x="1128.05" y="466" width="33.9" height="28" rx="14" fill="#2A9AA8"/>
<text x="1145" y="485" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<text x="1340" y="452" text-anchor="middle" font-size="15" fill="#3B37A8">audit session.created</text>
<text x="1340" y="472" text-anchor="middle" font-size="15" fill="#3B37A8">cancels a pending account deletion</text>
<rect x="1620" y="235" width="340" height="80" rx="8" fill="#2F9E6E"/>
<text x="1790.0" y="272.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">better-auth.session_token</text>
<text x="1790.0" y="295.0" text-anchor="middle" font-size="15" fill="#fff">cookie · opaque id</text>
<rect x="1620" y="355" width="340" height="80" rx="8" fill="#4A5568"/>
<text x="1790.0" y="392.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">better-auth.session_data</text>
<text x="1790.0" y="415.0" text-anchor="middle" font-size="15" fill="#fff">signed cookie cache · 5 min</text>
<rect x="1620" y="475" width="340" height="80" rx="8" fill="#D1495B"/>
<text x="1790.0" y="512.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Postgres</text>
<text x="1790.0" y="535.0" text-anchor="middle" font-size="15" fill="#fff">session row</text>
<path d="M1480,390 L1550,390 L1550,275 L1620,275" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<path d="M1480,390 L1620,390" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<path d="M1480,390 L1550,390 L1550,515 L1620,515" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="1533.05" y="316" width="33.9" height="28" rx="14" fill="#2F9E6E"/>
<text x="1550" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="1790" y="575" text-anchor="middle" font-size="15" fill="#3B37A8">cache carries acceptedTermsAt / acceptedPrivacyAt</text>
<rect x="30" y="650" width="1940" height="340" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="52" y="680" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">EVERY LATER REQUEST</text>
<rect x="60" y="700" width="190" height="80" rx="8" fill="#4A5568"/>
<text x="155.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Request</text>
<text x="155.0" y="760.0" text-anchor="middle" font-size="15" fill="#fff">page or /api</text>
<rect x="330" y="700" width="300" height="80" rx="8" fill="#DCDAF2"/>
<text x="480.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">proxy.ts</text>
<text x="480.0" y="760.0" text-anchor="middle" font-size="15" fill="#3B37A8">session cookie · public routes</text>
<rect x="730" y="700" width="320" height="80" rx="8" fill="#DCDAF2"/>
<text x="890.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">readCookieConsent</text>
<text x="890.0" y="760.0" text-anchor="middle" font-size="15" fill="#3B37A8">signed cookie cache, no DB</text>
<rect x="1150" y="700" width="260" height="80" rx="8" fill="#DCDAF2"/>
<text x="1280.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Page renders</text>
<text x="1280.0" y="760.0" text-anchor="middle" font-size="15" fill="#3B37A8">GET, not /onboarding</text>
<rect x="1510" y="700" width="430" height="80" rx="8" fill="#DCDAF2"/>
<text x="1725.0" y="737.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">DAL</text>
<text x="1725.0" y="760.0" text-anchor="middle" font-size="15" fill="#3B37A8">requireConsentedUser · requireMembership</text>
<path d="M250,740 L330,740" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="273.05" y="706" width="33.9" height="28" rx="14" fill="#64748B"/>
<text x="290" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
<path d="M630,740 L730,740" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="663.05" y="706" width="33.9" height="28" rx="14" fill="#64748B"/>
<text x="680" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
<path d="M1050,740 L1150,740" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="1083.05" y="706" width="33.9" height="28" rx="14" fill="#64748B"/>
<text x="1100" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text>
<path d="M1410,740 L1510,740" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="1443.05" y="706" width="33.9" height="28" rx="14" fill="#64748B"/>
<text x="1460" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text>
<text x="1725" y="802" text-anchor="middle" font-size="15" fill="#3B37A8">definitive check, reads the database</text>
<text x="1725" y="822" text-anchor="middle" font-size="15" fill="#3B37A8">redirects or 404 on its own</text>
<rect x="330" y="860" width="300" height="90" rx="8" fill="#D1495B"/>
<text x="480.0" y="902.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">401 or /sign-in</text>
<text x="480.0" y="925.0" text-anchor="middle" font-size="15" fill="#fff">no cookie: /api gets 401</text>
<text x="480" y="972" text-anchor="middle" font-size="15" fill="#475569">/sign-in?redirect=&lt;path&gt; for pages</text>
<path d="M480,780 L480,860" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="730" y="860" width="320" height="90" rx="8" fill="#E08A3C"/>
<text x="890.0" y="902.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">/onboarding/consent-setup</text>
<text x="890.0" y="925.0" text-anchor="middle" font-size="15" fill="#fff">terms or privacy missing</text>
<path d="M890,780 L890,860" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<text x="1230" y="880" text-anchor="middle" font-size="15" fill="#3B37A8">cache expired or tampered ("unknown")</text>
<text x="1230" y="900" text-anchor="middle" font-size="15" fill="#3B37A8">never blocks: the DAL decides</text>
</svg>