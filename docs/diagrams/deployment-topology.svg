<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Deployment topology</text>
<text x="40" y="84" font-size="19" fill="#475569">One host runs nginx, seven app instances, the worker, realtime and the stateful services; Cloudflare sits in front.</text>
