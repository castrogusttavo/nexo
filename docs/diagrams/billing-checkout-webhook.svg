<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" width="2000" height="900" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Checkout, webhook and trial revert</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="900" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Checkout, webhook and trial revert</text>
<text x="40" y="84" font-size="19" fill="#475569">A PENDING subscription is created at checkout, AbacatePay activates or ends it by webhook, and an hourly job drops expired trials to FREE.</text>
<rect x="20" y="125" width="640" height="700" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="42" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">1 · CHECKOUT</text>
<rect x="60" y="175" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="340.0" y="208.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">POST /api/payment/plan</text>
<text x="340.0" y="231.0" text-anchor="middle" font-size="15" fill="#3B37A8">session, rate limit, consent, Zod</text>
<rect x="60" y="280" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="340.0" y="313.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">SubscriptionService.create</text>
<text x="340.0" y="336.0" text-anchor="middle" font-size="15" fill="#3B37A8">OWNER or ADMIN only, coupon validated</text>
<path d="M340.0,247 L340.0,280" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="60" y="385" width="560" height="72" rx="8" fill="#4A5568"/>
<text x="340.0" y="418.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AbacatePay createSubscription</text>
<text x="340.0" y="441.0" text-anchor="middle" font-size="15" fill="#fff">CARD, metadata: workspace, plan, seats</text>
<path d="M340.0,352 L340.0,385" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="60" y="490" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="340.0" y="523.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Amount check</text>
<text x="340.0" y="546.0" text-anchor="middle" font-size="15" fill="#3B37A8">list price x seats; with a coupon, 0 to list</text>
<path d="M340.0,457 L340.0,490" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="60" y="595" width="560" height="72" rx="8" fill="#D1495B"/>
<text x="340.0" y="628.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Subscription PENDING</text>
<text x="340.0" y="651.0" text-anchor="middle" font-size="15" fill="#fff">billId, paymentUrl, amount</text>
<path d="M340.0,562 L340.0,595" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="60" y="700" width="560" height="72" rx="8" fill="#2F9E6E"/>
<text x="340.0" y="733.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">201 with the payment URL</text>
<text x="340.0" y="756.0" text-anchor="middle" font-size="15" fill="#fff">the user pays at AbacatePay</text>
<path d="M340.0,667 L340.0,700" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<text x="340" y="800" text-anchor="middle" font-size="15" fill="#D1495B">gateway error or amount mismatch: payment error, audited</text>
<rect x="680" y="125" width="640" height="700" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="702" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">2 · WEBHOOK</text>
<rect x="720" y="175" width="560" height="72" rx="8" fill="#4A5568"/>
<text x="1000.0" y="208.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">AbacatePay</text>
<text x="1000.0" y="231.0" text-anchor="middle" font-size="15" fill="#fff">subscription.completed, cancelled or expired</text>
<rect x="720" y="280" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1000.0" y="313.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">POST /api/payment/webhook</text>
<text x="1000.0" y="336.0" text-anchor="middle" font-size="15" fill="#3B37A8">webhookSecret, constant-time; Zod: event, data.id</text>
<rect x="720" y="385" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1000.0" y="418.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">handleWebhookEvent</text>
<text x="1000.0" y="441.0" text-anchor="middle" font-size="15" fill="#3B37A8">findByBillId</text>
<path d="M1000,247 L1000,280" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<path d="M1000,352 L1000,385" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="720" y="510" width="270" height="100" rx="8" fill="#D1495B"/>
<text x="855.0" y="557.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">activateWithPlan</text>
<text x="855.0" y="580.0" text-anchor="middle" font-size="15" fill="#fff">tx: PAID, activePlan = plan</text>
<rect x="1010" y="510" width="270" height="100" rx="8" fill="#D1495B"/>
<text x="1145.0" y="557.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">deactivateByBillId</text>
<text x="1145.0" y="580.0" text-anchor="middle" font-size="15" fill="#fff">tx: status ended, plan FREE</text>
<path d="M1000,457 L1000,484 L855,484 L855,510" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<path d="M1000,484 L1145,484 L1145,510" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="806.45" y="470" width="97.10000000000001" height="28" rx="14" fill="#2F9E6E"/>
<text x="855" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">completed</text>
<rect x="1060.9" y="470" width="168.20000000000002" height="28" rx="14" fill="#2F9E6E"/>
<text x="1145" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">cancelled, expired</text>
<rect x="720" y="660" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1000.0" y="693.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">WorkspaceCache.invalidate</text>
<text x="1000.0" y="716.0" text-anchor="middle" font-size="15" fill="#3B37A8">then audit, source webhook</text>
<path d="M855,610 L855,660" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<path d="M1145,610 L1145,660" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<text x="1000" y="770" text-anchor="middle" font-size="15" fill="#D1495B">failure: flat 500, so AbacatePay retries</text>
<text x="1000" y="790" text-anchor="middle" font-size="15" fill="#475569">unknown event: 200, ignored</text>
<rect x="1340" y="125" width="640" height="700" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1362" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">3 · TRIAL REVERT · WORKER · HOURLY</text>
<rect x="1380" y="175" width="560" height="72" rx="8" fill="#E08A3C"/>
<text x="1660.0" y="208.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">trial-lifecycle queue</text>
<text x="1660.0" y="231.0" text-anchor="middle" font-size="15" fill="#fff">cron 0 * * * *, revert-expired-trials</text>
<rect x="1380" y="280" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1660.0" y="313.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">processTrialLifecycle</text>
<text x="1660.0" y="336.0" text-anchor="middle" font-size="15" fill="#3B37A8">src/lib/queue/processors/trial-lifecycle.ts</text>
<rect x="1380" y="385" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1660.0" y="418.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">WorkspaceRepository.revertExpiredTrials</text>
<text x="1660.0" y="441.0" text-anchor="middle" font-size="15" fill="#3B37A8">trialEndsAt past, plan not FREE, no PAID sub</text>
<rect x="1380" y="490" width="560" height="72" rx="8" fill="#D1495B"/>
<text x="1660.0" y="523.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Workspace.activePlan = FREE</text>
<text x="1660.0" y="546.0" text-anchor="middle" font-size="15" fill="#fff">one updateMany</text>
<rect x="1380" y="595" width="560" height="72" rx="8" fill="#DCDAF2"/>
<text x="1660.0" y="628.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">WorkspaceCache.invalidate</text>
<text x="1660.0" y="651.0" text-anchor="middle" font-size="15" fill="#3B37A8">per workspace; a Redis failure is only logged</text>
<path d="M1660,247 L1660,280" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<path d="M1660,352 L1660,385" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<path d="M1660,457 L1660,490" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<path d="M1660,562 L1660,595" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
</svg>