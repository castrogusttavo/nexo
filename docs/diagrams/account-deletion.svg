<text x="850.0" y="545.0" text-anchor="middle" font-size="15" fill="#fff">deletion_canceled · user_not_found</text>
<path d="M850.0,440 L850.0,490" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
