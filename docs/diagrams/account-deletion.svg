<text x="850.0" y="420.0" text-anchor="middle" font-size="15" fill="#3B37A8">deletionScheduledAt set</text>
<rect x="1060" y="360" width="260" height="80" rx="8" fill="#DCDAF2"/>
<text x="1190.0" y="397.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">deleteHard</text>
<text x="1190.0" y="420.0" text-anchor="middle" font-size="15" fill="#3B37A8">prisma.user.delete</text>
<rect x="1400" y="360" width="320" height="80" rx="8" fill="#D1495B"/>
<text x="1560.0" y="397.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Postgres</text>
