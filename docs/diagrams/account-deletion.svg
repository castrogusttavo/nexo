<text x="900" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5 after 30 days</text>
<rect x="380" y="360" width="260" height="80" rx="8" fill="#DCDAF2"/>
<text x="510.0" y="397.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">processDeleteAccount</text>
<text x="510.0" y="420.0" text-anchor="middle" font-size="15" fill="#3B37A8">reads the user</text>
<rect x="720" y="360" width="260" height="80" rx="8" fill="#DCDAF2"/>
