<rect x="663.05" y="166" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="680" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
<path d="M980,200 L1060,200" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1003.05" y="166" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="1020" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
<path d="M1320,200 L1400,200" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<rect x="1343.05" y="166" width="33.9" height="28" rx="14" fill="#E08A3C"/>
<text x="1360" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
<text x="850.0" y="262" text-anchor="middle" font-size="15" fill="#3B37A8">sole OWNER of a shared workspace: 409</text>
<text x="1190.0" y="262" text-anchor="middle" font-size="15" fill="#3B37A8">sessions deleted · UserCache invalidated</text>
<text x="1190.0" y="282" text-anchor="middle" font-size="15" fill="#3B37A8">confirmation e-mail sent</text>
<text x="1530" y="262" text-anchor="middle" font-size="15" fill="#3B37A8">jobId per user</text>
<text x="1530" y="282" text-anchor="middle" font-size="15" fill="#3B37A8">enqueue fails: schedule cleared</text>
<text x="380" y="338" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">GRACE PERIOD ENDS · WORKER</text>
