<text x="1190.0" y="462" text-anchor="middle" font-size="15" fill="#3B37A8">UserCache invalidated, then logged</text>
<rect x="30" y="600" width="1940" height="220" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="52" y="630" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">CANCEL PATH · BEFORE THE JOB FIRES</text>
<rect x="60" y="640" width="320" height="70" rx="8" fill="#DCDAF2"/>
<text x="220.0" y="672.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">DELETE /api/users/me/deletion</text>
<text x="220.0" y="695.0" text-anchor="middle" font-size="15" fill="#3B37A8">explicit cancel</text>
<rect x="60" y="730" width="320" height="70" rx="8" fill="#DCDAF2"/>
<text x="220.0" y="762.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Sign in again</text>
