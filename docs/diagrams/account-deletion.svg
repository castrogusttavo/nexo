<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1160" width="2000" height="1160" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Account deletion and data export</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="1160" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Account deletion and data export</text>
<text x="40" y="84" font-size="19" fill="#475569">Deletion is scheduled 30 days out as a delayed job and can be cancelled until it fires; export is a separate on-demand job.</text>
<text x="40" y="130" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">SCHEDULE</text>
<rect x="40" y="160" width="260" height="80" rx="8" fill="#4A5568"/>
<text x="170.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">User</text>
<text x="170.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">account settings</text>
<rect x="380" y="160" width="260" height="80" rx="8" fill="#DCDAF2"/>
<text x="510.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">DELETE /api/users/me</text>
<text x="510.0" y="220.0" text-anchor="middle" font-size="15" fill="#3B37A8">session + rate limit</text>
<rect x="720" y="160" width="260" height="80" rx="8" fill="#DCDAF2"/>
<text x="850.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">deleteAccount</text>
<text x="850.0" y="220.0" text-anchor="middle" font-size="15" fill="#3B37A8">AccountLifecycleService</text>
<rect x="1060" y="160" width="260" height="80" rx="8" fill="#D1495B"/>
<text x="1190.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">deletionScheduledAt</text>
<text x="1190.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">now + 30 days · User row</text>
<rect x="1400" y="160" width="320" height="80" rx="8" fill="#E08A3C"/>
<text x="1560.0" y="197.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">account-lifecycle queue</text>
<text x="1560.0" y="220.0" text-anchor="middle" font-size="15" fill="#fff">delayed delete-account job</text>
<path d="M300,200 L380,200" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="323.05" y="166" width="33.9" height="28" rx="14" fill="#5B54D6"/>
<text x="340" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
