<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 800" width="2000" height="800" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>When a deploy goes bad</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="800" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">When a deploy goes bad</text>
<text x="40" y="84" font-size="19" fill="#475569">There is no rollback job: every option either fixes forward through CI and CD or uses a server-ops mode.</text>
<rect x="40" y="330" width="240" height="100" rx="8" fill="#D1495B"/>
<text x="160.0" y="377.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Bad deploy</text>
<text x="160.0" y="400.0" text-anchor="middle" font-size="15" fill="#fff">users or /status notice it</text>
<rect x="40" y="500" width="240" height="90" rx="8" fill="#4A5568"/>
<text x="160.0" y="542.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Health gate</text>
<text x="160.0" y="565.0" text-anchor="middle" font-size="15" fill="#fff">unhealthy after 90 s: stop</text>
<path d="M160,430 L160,500" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<text x="160" y="625" text-anchor="middle" font-size="15" fill="#475569">a stopped rollout leaves a mixed fleet,</text>
<text x="160" y="645" text-anchor="middle" font-size="15" fill="#475569">old and new, and the migration</text>
<text x="160" y="665" text-anchor="middle" font-size="15" fill="#475569">has already run</text>
<path d="M310,380 L330,380" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round"/>
<path d="M330,195 L330,645" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round"/>
<path d="M280,380 L330,380" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round"/>
<rect x="380" y="150" width="380" height="90" rx="8" fill="#DCDAF2"/>
<text x="570.0" y="192.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Code regression</text>
<text x="570.0" y="215.0" text-anchor="middle" font-size="15" fill="#3B37A8">or a rollout halted at the gate</text>
<path d="M330,195 L380,195" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="900" y="150" width="380" height="90" rx="8" fill="#2F9E6E"/>
<text x="1090.0" y="192.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Revert commit on main</text>
<text x="1090.0" y="215.0" text-anchor="middle" font-size="15" fill="#fff">push, never force-push</text>
<path d="M760,195 L900,195" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="1420" y="150" width="480" height="90" rx="8" fill="#4A5568"/>
<text x="1660.0" y="192.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CI gate, then CD redeploys latest</text>
<text x="1660.0" y="215.0" text-anchor="middle" font-size="15" fill="#fff">infra/app.yml pins latest</text>
<path d="M1280,195 L1420,195" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="380" y="300" width="380" height="90" rx="8" fill="#DCDAF2"/>
<text x="570.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Environment or secret wrong</text>
<text x="570.0" y="365.0" text-anchor="middle" font-size="15" fill="#3B37A8">a rejected key, a missing variable</text>
<path d="M330,345 L380,345" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="900" y="300" width="380" height="90" rx="8" fill="#2F9E6E"/>
<text x="1090.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Fix sops, then env-sync</text>
<text x="1090.0" y="365.0" text-anchor="middle" font-size="15" fill="#fff">server-ops mode env-sync</text>
<path d="M760,345 L900,345" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<rect x="1420" y="300" width="480" height="90" rx="8" fill="#4A5568"/>
<text x="1660.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">rewrites .env, restarts app, worker, realtime</text>
<text x="1660.0" y="365.0" text-anchor="middle" font-size="15" fill="#fff">prints variable names only</text>
<path d="M1280,345 L1420,345" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<rect x="380" y="450" width="380" height="90" rx="8" fill="#DCDAF2"/>
<text x="570.0" y="492.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Stack not running</text>
<text x="570.0" y="515.0" text-anchor="middle" font-size="15" fill="#3B37A8">containers stopped or unhealthy</text>
<path d="M330,495 L380,495" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="900" y="450" width="380" height="90" rx="8" fill="#2F9E6E"/>
<text x="1090.0" y="492.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">server-ops app-up</text>
<text x="1090.0" y="515.0" text-anchor="middle" font-size="15" fill="#fff">workflow_dispatch</text>
<path d="M760,495 L900,495" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<rect x="1420" y="450" width="480" height="90" rx="8" fill="#4A5568"/>
<text x="1660.0" y="492.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">compose up from the current file</text>
<text x="1660.0" y="515.0" text-anchor="middle" font-size="15" fill="#fff">no rebuild, no image change</text>
<path d="M1280,495 L1420,495" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<rect x="380" y="600" width="380" height="90" rx="8" fill="#DCDAF2"/>
<text x="570.0" y="642.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Schema problem</text>
<text x="570.0" y="665.0" text-anchor="middle" font-size="15" fill="#3B37A8">a migration misbehaves</text>
<path d="M330,645 L380,645" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="900" y="600" width="380" height="90" rx="8" fill="#2F9E6E"/>
<text x="1090.0" y="642.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">New forward migration</text>
<text x="1090.0" y="665.0" text-anchor="middle" font-size="15" fill="#fff">prisma migrate deploy</text>
<path d="M760,645 L900,645" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1420" y="600" width="480" height="90" rx="8" fill="#4A5568"/>
<text x="1660.0" y="642.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">applied by the next CD run</text>
<text x="1660.0" y="665.0" text-anchor="middle" font-size="15" fill="#fff">no down migrations exist</text>
<path d="M1280,645 L1420,645" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<text x="900" y="770" text-anchor="start" font-size="15" fill="#475569">Reverting an image by hand on the host (editing the compose tag): not scripted, to confirm.</text>
</svg>