<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 860" width="2000" height="860" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Request flow</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="860" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">Request flow</text>
<text x="40" y="84" font-size="19" fill="#475569">One API call crosses proxy.ts, a thin route, a service and a repository; no layer throws, a Result travels back to handleError.</text>
<rect x="380" y="120" width="880" height="70" rx="8" fill="#4A5568"/>
<text x="820.0" y="152.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Axiom</text>
<text x="820.0" y="175.0" text-anchor="middle" font-size="15" fill="#fff">request logs from proxy.ts and withAxiom, audit events from services</text>
