<text x="810" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">log</text>
<rect x="1107.25" y="200" width="65.5" height="28" rx="14" fill="#64748B"/>
<text x="1140" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">audit</text>
<rect x="900" y="650" width="500" height="80" rx="8" fill="#D1495B"/>
<text x="1150.0" y="687.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Redis</text>
<text x="1150.0" y="710.0" text-anchor="middle" font-size="15" fill="#fff">rate-limit counters · read-through caches</text>
<path d="M890,400 L890,420 L975,420 L975,650" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<rect x="922.5" y="586" width="105.0" height="28" rx="14" fill="#E08A3C"/>
<text x="975" y="605" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">rate limit</text>
<path d="M1220,400 L1220,420 L1305,420 L1305,650" fill="none" stroke="#E08A3C" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-orange)"/>
<rect x="1268.3" y="586" width="73.4" height="28" rx="14" fill="#E08A3C"/>
<text x="1305" y="605" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">caches</text>
<text x="480" y="440" text-anchor="middle" font-size="15" fill="#475569">CSP and HSTS headers</text>
<text x="480" y="462" text-anchor="middle" font-size="15" fill="#475569">session cookie present?</text>
<text x="480" y="484" text-anchor="middle" font-size="15" fill="#475569">consent in cookie cache?</text>
<text x="480" y="506" text-anchor="middle" font-size="15" fill="#475569">no: 401 (api) or redirect</text>
<text x="810" y="440" text-anchor="middle" font-size="15" fill="#475569">withAxiom</text>
<text x="810" y="462" text-anchor="middle" font-size="15" fill="#475569">getAuthSession()</text>
<text x="810" y="484" text-anchor="middle" font-size="15" fill="#475569">consume(apiLimiter, user:id)</text>
<text x="810" y="506" text-anchor="middle" font-size="15" fill="#475569">requireConsent (opt-in)</text>
<text x="810" y="528" text-anchor="middle" font-size="15" fill="#475569">Zod safeParse of the body</text>
<text x="1140" y="440" text-anchor="middle" font-size="15" fill="#475569">authorization: ownership</text>
<text x="1140" y="462" text-anchor="middle" font-size="15" fill="#475569">business rules</text>
<text x="1140" y="484" text-anchor="middle" font-size="15" fill="#475569">auditMutation / auditAuth</text>
<text x="1470" y="440" text-anchor="middle" font-size="15" fill="#475569">Prisma inside try/catch</text>
<text x="1470" y="462" text-anchor="middle" font-size="15" fill="#475569">ok(value) or err(...)</text>
<text x="1470" y="484" text-anchor="middle" font-size="15" fill="#475569">no business rules</text>
<text x="1800" y="440" text-anchor="middle" font-size="15" fill="#475569">Prisma 7 client</text>
<rect x="40" y="620" width="820" height="190" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="62" y="650" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">ERROR PATH · NO THROWN ERRORS</text>
<rect x="60" y="670" width="220" height="80" rx="8" fill="#DCDAF2"/>
<text x="170.0" y="707.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">AppError</text>
<text x="170.0" y="730.0" text-anchor="middle" font-size="15" fill="#3B37A8">code from ERROR_CODES</text>
<rect x="330" y="670" width="220" height="80" rx="8" fill="#DCDAF2"/>
<text x="440.0" y="707.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">handleError</text>
<text x="440.0" y="730.0" text-anchor="middle" font-size="15" fill="#3B37A8">code maps to HTTP status</text>
<rect x="600" y="670" width="220" height="80" rx="8" fill="#DCDAF2"/>
<text x="710.0" y="707.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Response</text>
<text x="710.0" y="730.0" text-anchor="middle" font-size="15" fill="#3B37A8">success, statusCode, error</text>
<path d="M280,710 L330,710" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<path d="M550,710 L600,710" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
