<text x="810.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">API route</text>
<text x="810.0" y="365.0" text-anchor="middle" font-size="15" fill="#3B37A8">app/api/**/route.ts</text>
<rect x="1040" y="290" width="200" height="110" rx="8" fill="#DCDAF2"/>
<text x="1140.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Service</text>
<text x="1140.0" y="365.0" text-anchor="middle" font-size="15" fill="#3B37A8">src/services</text>
<rect x="1370" y="290" width="200" height="110" rx="8" fill="#DCDAF2"/>
<text x="1470.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Repository</text>
<text x="1470.0" y="365.0" text-anchor="middle" font-size="15" fill="#3B37A8">src/repositories</text>
<rect x="1700" y="290" width="200" height="110" rx="8" fill="#D1495B"/>
<text x="1800.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">PostgreSQL</text>
<text x="1800.0" y="365.0" text-anchor="middle" font-size="15" fill="#fff">through Prisma</text>
