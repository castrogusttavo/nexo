<text x="480.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">proxy.ts</text>
<text x="480.0" y="365.0" text-anchor="middle" font-size="15" fill="#3B37A8">edge entry point</text>
