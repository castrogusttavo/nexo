<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 820" width="2000" height="820" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>WorkspaceInvitation lifecycle</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="820" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">WorkspaceInvitation lifecycle</text>
<text x="40" y="84" font-size="19" fill="#475569">Four states; expiry is lazy (decided when someone touches the invitation) and the seat cap is checked at create and at accept.</text>
<rect x="40" y="290" width="300" height="110" rx="8" fill="#4A5568"/>
<text x="190.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">create</text>
<text x="190.0" y="365.0" text-anchor="middle" font-size="15" fill="#fff">OWNER or ADMIN, or project lead</text>
<rect x="700" y="280" width="300" height="130" rx="8" fill="#E08A3C"/>
<text x="850.0" y="342.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">PENDING</text>
<text x="850.0" y="365.0" text-anchor="middle" font-size="15" fill="#fff">token + expiresAt (7 days)</text>
<rect x="1450" y="130" width="300" height="100" rx="8" fill="#2F9E6E"/>
<text x="1600.0" y="177.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">ACCEPTED</text>
<text x="1600.0" y="200.0" text-anchor="middle" font-size="15" fill="#fff">terminal</text>
<rect x="1450" y="460" width="300" height="100" rx="8" fill="#D1495B"/>
<text x="1600.0" y="507.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">REVOKED</text>
<text x="1600.0" y="530.0" text-anchor="middle" font-size="15" fill="#fff">terminal</text>
<rect x="700" y="600" width="300" height="100" rx="8" fill="#4A5568"/>
<text x="850.0" y="647.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">EXPIRED</text>
<text x="850.0" y="670.0" text-anchor="middle" font-size="15" fill="#fff">not terminal: resend revives it</text>
<path d="M340,345 L700,345" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="471.45" y="331" width="97.10000000000001" height="28" rx="14" fill="#5B54D6"/>
<text x="520" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1. create</text>
<text x="520" y="380" text-anchor="middle" font-size="15" fill="#475569">target is not already a member,</text>
<text x="520" y="400" text-anchor="middle" font-size="15" fill="#475569">no live pending invite for the email</text>
<text x="520" y="425" text-anchor="middle" font-size="15" fill="#D1495B">members + pending &gt;= seats: SEAT LIMIT</text>
<text x="520" y="445" text-anchor="middle" font-size="15" fill="#D1495B">(advisory lock in the transaction)</text>
<path d="M1000,320 L1225,320 L1225,180 L1450,180" fill="none" stroke="#2F9E6E" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-green)"/>
<rect x="1176.45" y="236" width="97.10000000000001" height="28" rx="14" fill="#2F9E6E"/>
<text x="1225" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2. accept</text>
<text x="1195" y="150" text-anchor="end" font-size="15" fill="#475569">token PENDING, not past expiresAt, email matches,</text>
<text x="1195" y="170" text-anchor="end" font-size="15" fill="#475569">members &gt;= seats: SEAT LIMIT (pending not counted)</text>
<text x="1600" y="255" text-anchor="middle" font-size="15" fill="#475569">one transaction: Membership,</text>
<text x="1600" y="275" text-anchor="middle" font-size="15" fill="#475569">ProjectMember if projectId, user updated</text>
<path d="M1000,380 L1225,380 L1225,510 L1450,510" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="1176.45" y="431" width="97.10000000000001" height="28" rx="14" fill="#D1495B"/>
<text x="1225" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3. revoke</text>
<text x="1225" y="580" text-anchor="middle" font-size="15" fill="#475569">only while PENDING, else not pending</text>
<path d="M790,410 L790,600" fill="none" stroke="#64748B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-gray)"/>
<rect x="733.55" y="491" width="112.9" height="28" rx="14" fill="#64748B"/>
<text x="790" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">lazy expiry</text>
<path d="M910,600 L910,410" fill="none" stroke="#3B82C4" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-blue)"/>
<rect x="861.45" y="491" width="97.10000000000001" height="28" rx="14" fill="#3B82C4"/>
<text x="910" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4. resend</text>
<text x="1030" y="650" text-anchor="start" font-size="15" fill="#475569">resend also works on PENDING:</text>
<text x="1030" y="670" text-anchor="start" font-size="15" fill="#475569">new token, +7 days, status PENDING</text>
<text x="630" y="560" text-anchor="end" font-size="15" fill="#475569">on accept past expiresAt, or when a new</text>
<text x="630" y="580" text-anchor="end" font-size="15" fill="#475569">invite meets an expired one for the same email</text>
<text x="1600" y="620" text-anchor="middle" font-size="15" fill="#475569">resend on ACCEPTED or REVOKED is refused</text>
<text x="1600" y="640" text-anchor="middle" font-size="15" fill="#475569">(invitation not pending)</text>
<text x="1000" y="770" text-anchor="middle" font-size="15" fill="#475569">accept on an EXPIRED or non-pending invitation is refused; the email is sent by dispatchEmail and its failure is only logged.</text>
</svg>