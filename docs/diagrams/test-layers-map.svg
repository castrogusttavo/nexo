<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" width="2000" height="900" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>The test layers</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="900" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">The test layers</text>
<text x="40" y="84" font-size="19" fill="#475569">Each layer answers a different question, so a bug that slips through one is usually invisible to the layers above it.</text>
<text x="300" y="150" text-anchor="middle" font-size="15" fill="#475569">LAYER</text>
<text x="560" y="150" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">QUESTION IT ANSWERS</text>
<text x="1170" y="150" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">RUNNER AND COMMAND</text>
<text x="1620" y="150" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">NEEDS</text>
<rect x="208.0" y="175" width="184" height="64" rx="8" fill="#DCDAF2"/>
<text x="300.0" y="213.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">mutation</text>
<text x="560" y="213.0" font-size="19" fill="#1E293B">Would a broken line actually fail a test?</text>
<text x="1170" y="205.0" font-size="17" font-weight="700" fill="#1E293B">Stryker over the unit suite</text>
<text x="1170" y="228.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:mutation</text>
<text x="1620" y="213.0" font-size="17" fill="#1E293B">nothing (weekly)</text>
<line x1="520" y1="246.0" x2="1960" y2="246.0" stroke="#E5E2DA"/>
<rect x="194.0" y="253" width="212" height="64" rx="8" fill="#E08A3C"/>
<text x="300.0" y="291.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">visual</text>
<text x="560" y="291.0" font-size="19" fill="#1E293B">Does it still look the same, pixel for pixel?</text>
<text x="1170" y="283.0" font-size="17" font-weight="700" fill="#1E293B">Playwright visual</text>
<text x="1170" y="306.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:visual</text>
<text x="1620" y="291.0" font-size="17" fill="#1E293B">Docker + build</text>
<line x1="520" y1="324.0" x2="1960" y2="324.0" stroke="#E5E2DA"/>
<rect x="180.0" y="331" width="240" height="64" rx="8" fill="#E08A3C"/>
<text x="300.0" y="369.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">browser</text>
<text x="560" y="369.0" font-size="19" fill="#1E293B">Does the real UI work in Chromium?</text>
<text x="1170" y="361.0" font-size="17" font-weight="700" fill="#1E293B">Playwright chromium</text>
<text x="1170" y="384.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:browser</text>
<text x="1620" y="369.0" font-size="17" fill="#1E293B">build + Postgres + Redis</text>
<line x1="520" y1="402.0" x2="1960" y2="402.0" stroke="#E5E2DA"/>
<rect x="166.0" y="409" width="268" height="64" rx="8" fill="#E08A3C"/>
<text x="300.0" y="447.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">e2e (HTTP)</text>
<text x="560" y="447.0" font-size="19" fill="#1E293B">Does the running server answer the route correctly?</text>
<text x="1170" y="439.0" font-size="17" font-weight="700" fill="#1E293B">Vitest e2e</text>
<text x="1170" y="462.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:e2e</text>
<text x="1620" y="447.0" font-size="17" fill="#1E293B">server + Postgres + Redis</text>
<line x1="520" y1="480.0" x2="1960" y2="480.0" stroke="#E5E2DA"/>
<rect x="152.0" y="487" width="296" height="64" rx="8" fill="#DCDAF2"/>
<text x="300.0" y="525.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">contract</text>
<text x="560" y="525.0" font-size="19" fill="#1E293B">Does public/openapi.json still match the code?</text>
<text x="1170" y="517.0" font-size="17" font-weight="700" fill="#1E293B">Vitest contract</text>
<text x="1170" y="540.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:contract</text>
<text x="1620" y="525.0" font-size="17" fill="#1E293B">nothing (reads files)</text>
<line x1="520" y1="558.0" x2="1960" y2="558.0" stroke="#E5E2DA"/>
<rect x="138.0" y="565" width="324" height="64" rx="8" fill="#D1495B"/>
<text x="300.0" y="603.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">integration</text>
<text x="560" y="603.0" font-size="19" fill="#1E293B">Does the query or cache behave on a real database?</text>
<text x="1170" y="595.0" font-size="17" font-weight="700" fill="#1E293B">Vitest integration</text>
<text x="1170" y="618.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:integration</text>
<text x="1620" y="603.0" font-size="17" fill="#1E293B">Postgres + Redis</text>
<line x1="520" y1="636.0" x2="1960" y2="636.0" stroke="#E5E2DA"/>
<rect x="124.0" y="643" width="352" height="64" rx="8" fill="#DCDAF2"/>
<text x="300.0" y="681.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">component</text>
<text x="560" y="681.0" font-size="19" fill="#1E293B">Does the hook or client component behave in a DOM?</text>
<text x="1170" y="673.0" font-size="17" font-weight="700" fill="#1E293B">Vitest component (jsdom)</text>
<text x="1170" y="696.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:component</text>
<text x="1620" y="681.0" font-size="17" fill="#1E293B">nothing</text>
<line x1="520" y1="714.0" x2="1960" y2="714.0" stroke="#E5E2DA"/>
<rect x="110.0" y="721" width="380" height="64" rx="8" fill="#DCDAF2"/>
<text x="300.0" y="759.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">unit</text>
<text x="560" y="759.0" font-size="19" fill="#1E293B">Is the business rule right, collaborators mocked?</text>
<text x="1170" y="751.0" font-size="17" font-weight="700" fill="#1E293B">Vitest unit</text>
<text x="1170" y="774.0" font-size="15" fill="#475569" font-family="monospace">pnpm test:unit</text>
<text x="1620" y="759.0" font-size="17" fill="#1E293B">nothing</text>
<rect x="560" y="831" width="22" height="22" rx="5" fill="#DCDAF2"/>
<text x="592" y="849" font-size="16" fill="#475569">needs nothing</text>
<rect x="800" y="831" width="22" height="22" rx="5" fill="#D1495B"/>
<text x="832" y="849" font-size="16" fill="#475569">needs Postgres + Redis</text>
<rect x="1130" y="831" width="22" height="22" rx="5" fill="#E08A3C"/>
<text x="1162" y="849" font-size="16" fill="#475569">needs a server or build</text>
<text x="1960" y="849" text-anchor="end" font-size="15" fill="#475569">Also: redis-tls project, a TLS Redis smoke, in its own CI job.</text>
</svg>