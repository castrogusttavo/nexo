<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 780" width="2000" height="780" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>What creating a project seeds</title><defs><marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E08A3C"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F9E6E"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A9AA8"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B54D6"/></marker><marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B82C4"/></marker></defs>
<rect width="2000" height="780" fill="#FBFAF7"/>
<text x="40" y="52" font-size="34" font-weight="800" fill="#1E293B">What creating a project seeds</text>
<text x="40" y="84" font-size="19" fill="#475569">ProjectService.create retries the identifier; ProjectRepository.create seeds everything a new project needs in one transaction.</text>
<rect x="20" y="125" width="700" height="590" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="42" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">PROJECTSERVICE.CREATE</text>
<rect x="100" y="175" width="590" height="80" rx="8" fill="#DCDAF2"/>
<text x="395.0" y="212.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Gate</text>
<text x="395.0" y="235.0" text-anchor="middle" font-size="15" fill="#3B37A8">member; OWNER/ADMIN, else membersCanCreateProjects</text>
<rect x="100" y="295" width="590" height="80" rx="8" fill="#DCDAF2"/>
<text x="395.0" y="332.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">Identifier</text>
<text x="395.0" y="355.0" text-anchor="middle" font-size="15" fill="#3B37A8">given by the user, else derived from the name</text>
<rect x="100" y="415" width="590" height="80" rx="8" fill="#DCDAF2"/>
<text x="395.0" y="452.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">ProjectRepository.create</text>
<text x="395.0" y="475.0" text-anchor="middle" font-size="15" fill="#3B37A8">the transaction on the right</text>
<rect x="100" y="535" width="590" height="100" rx="8" fill="#DCDAF2"/>
<text x="395.0" y="582.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">On PROJECT_IDENTIFIER_CONFLICT</text>
<text x="395.0" y="605.0" text-anchor="middle" font-size="15" fill="#3B37A8">user gave none: max 5 attempts, base + number (10 chars)</text>
<path d="M395,255 L395,295" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M395,375 L395,415" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M395,495 L395,535" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<path d="M100,585 L60,585 L60,335 L100,335" fill="none" stroke="#D1495B" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-red)"/>
<rect x="27.25" y="446" width="65.5" height="28" rx="14" fill="#D1495B"/>
<text x="60" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">retry</text>
<text x="370" y="690" text-anchor="middle" font-size="15" fill="#475569">a user-given identifier or slug conflict fails; success: audit and toProjectDTO</text>
<rect x="760" y="125" width="1220" height="590" rx="14" fill="none" stroke="#B8BEC8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="782" y="155" font-size="15" font-weight="700" letter-spacing="1" fill="#7A5A2B">ONE TRANSACTION · PROJECTREPOSITORY.CREATE</text>
<rect x="800" y="175" width="560" height="80" rx="8" fill="#DCDAF2"/>
<text x="1080.0" y="212.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3B37A8">1 · Default ProjectState</text>
<text x="1080.0" y="235.0" text-anchor="middle" font-size="15" fill="#3B37A8">the workspace one, isDefault; fails if missing</text>
<rect x="800" y="300" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1080.0" y="337.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2 · Project</text>
<text x="1080.0" y="360.0" text-anchor="middle" font-size="15" fill="#fff">stateId = that state, leadId = the actor</text>
<path d="M1080,255 L1080,300" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="800" y="425" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1080.0" y="462.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3 · EstimateSettings</text>
<text x="1080.0" y="485.0" text-anchor="middle" font-size="15" fill="#fff">one row for the project</text>
<path d="M1080,380 L1080,425" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="800" y="550" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1080.0" y="587.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4 · ProjectMember</text>
<text x="1080.0" y="610.0" text-anchor="middle" font-size="15" fill="#fff">the lead is the first member</text>
<path d="M1080,505 L1080,550" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1400" y="175" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1680.0" y="212.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">5 · States</text>
<text x="1680.0" y="235.0" text-anchor="middle" font-size="15" fill="#fff">DEFAULT_STATES</text>
<rect x="1400" y="300" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1680.0" y="337.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">6 · Labels</text>
<text x="1680.0" y="360.0" text-anchor="middle" font-size="15" fill="#fff">DEFAULT_LABELS</text>
<path d="M1680,255 L1680,300" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1400" y="425" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1680.0" y="462.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">7 · EstimateValues</text>
<text x="1680.0" y="485.0" text-anchor="middle" font-size="15" fill="#fff">DEFAULT_ESTIMATE_VALUES, ordered, on the settings</text>
<path d="M1680,380 L1680,425" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<rect x="1400" y="550" width="560" height="80" rx="8" fill="#D1495B"/>
<text x="1680.0" y="587.0" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">8 · IssueTypes</text>
<text x="1680.0" y="610.0" text-anchor="middle" font-size="15" fill="#fff">DEFAULT_ISSUE_TYPE (Task, Epic), isSystem</text>
<path d="M1680,505 L1680,550" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<path d="M1360,590 L1380,590 L1380,215 L1400,215" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
<text x="1380" y="675" text-anchor="middle" font-size="15" fill="#475569">any failure rolls all of it back</text>
<path d="M690,455 L740,455 L740,215 L800,215" fill="none" stroke="#5B54D6" stroke-width="2.2" stroke-dasharray="7 6" stroke-linejoin="round" marker-end="url(#m-purple)"/>
</svg>