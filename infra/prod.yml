# Copied to /var/www/nexo on the server, so every relative path here is
# resolved *there*, not from this directory. That is why they stay `./` while
# infra/dev.yml uses `../`.
name: nexo

# Production infrastructure, as it runs on the server.
#
# This file used to exist *only* at /var/www/nexo/docker-compose.infra.yml,
# because the CD copies docker-compose.yml and never this one. That is how the
# server ended up with a RabbitMQ nothing talks to, while the repository's
# docker-compose.infra.yml — which is the *development* stack — grew a replica
# and a pgbouncer production never had. Two different files with the same name
# drifting apart in silence, which the storage migration finally made visible.
#
# Names matter here and are deliberately kept: `nexo-db-1` is what the nightly
# backup calls (`docker exec nexo-db-1 pg_dump`), and `nexo-minio-1` is what
# the storage tooling expects. Renaming either breaks something that only
# reports the failure on the day you need it.
#
# The corresponding values live in /var/www/nexo/.env, written by the CD from
# sops. Nothing here carries a literal credential.

services:
  nexo-db:
    image: postgres:17-alpine
    container_name: nexo-db-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-redis-master:
    image: bitnami/redis:latest
    container_name: nexo-redis
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "yes"
      REDIS_TLS_PORT_NUMBER: 6379
      REDIS_PORT_NUMBER: 0
      REDIS_TLS_CERT_FILE: /opt/bitnami/redis/certs/redis.crt
      REDIS_TLS_KEY_FILE: /opt/bitnami/redis/certs/redis.key
      REDIS_TLS_CA_FILE: /opt/bitnami/redis/certs/ca.crt
      REDIS_TLS_AUTH_CLIENTS: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/bitnami/redis/data
      - ./redis-tls:/opt/bitnami/redis/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -a $${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Read replica in streaming replication. It clones the primary with
  # pg_basebackup on its first start (entrypoint-replica.sh) into its own
  # volume, then every later start comes up as a standby on its own.
  #
  # The primary above is deliberately left byte-identical to what is already
  # running: adding so much as an environment variable to it would make
  # `up -d` recreate the container, and restarting production's database is
  # not a price worth paying for a variable that only matters when a volume
  # is initialised from empty. The replicator role and the pg_hba line are
  # applied to the live primary instead, by the server-ops workflow.
  #
  # No published port: nothing outside the docker network reads from it yet.
  nexo-db-replica:
    image: postgres:17-alpine
    container_name: nexo-db-replica
    restart: unless-stopped
    entrypoint: ["/entrypoint-replica.sh"]
    environment:
      PRIMARY_HOST: nexo-db
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres-replica/entrypoint-replica.sh:/entrypoint-replica.sh:ro
    depends_on:
      nexo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network

  # Transaction pooling in front of the primary. Additive on purpose: it
  # changes nothing about Postgres and nothing about the app until the app is
  # pointed at it, which is a separate decision (Prisma needs `pgbouncer=true`
  # in the URL, or transaction pooling breaks its prepared statements).
  #
  # Bound to the loopback rather than published: the app containers reach it
  # over the docker network, and nothing off this machine should.
  nexo-pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: nexo-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: nexo-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      nexo-db:
        condition: service_healthy
    networks:
      - app-network

  # Silo, the maintained AGPL fork of the MinIO server. MinIO archived its
  # open-source project and withdrew every public image and binary, so the tag
  # this replaced cannot be pulled by anyone, anywhere, any more.
  nexo-storage:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: nexo-minio-1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000" # API
      - "127.0.0.1:9001:9001" # Console Web
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

# `rabbitmqdata` is deliberately absent along with the service that used it:
# nothing in this codebase speaks AMQP — no dependency, no client, no
# environment variable, no import. The queues are BullMQ over Redis. It was a
# leftover of an earlier architecture, costing memory and one more listening
# port in production for nobody.
volumes:
  pgdata:
  pgdata-replica:
  redis-master-data:
  miniodata:

networks:
  app-network:
    name: nexo_default
