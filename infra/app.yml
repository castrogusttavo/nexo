# Copied to /var/www/nexo on the server, so every relative path here — the
# TLS certificate mounts and `.env` alike — is resolved *there*, not from this
# directory. That is why they stay as they are while infra/dev.yml uses `../`,
# and why `docker compose -f infra/app.yml config` only validates on the
# server, where the file it names actually sits next to it.
name: nexo

# Public, non-secret settings shared by every service; they override the same
# keys in the sops-decrypted .env. NEXT_PUBLIC_REALTIME_URL
# is validated at startup by lib/env (app, worker and realtime all crash-loop
# without it) and is also baked into the client bundle via the CD build-args.
# nginx proxies /realtime (same origin, so the session cookie reaches the
# Hocuspocus server) to the realtime service on 127.0.0.1:1234.
# The router does not hairpin: a container resolving the public names to the
# public IP times out. Point them at the Docker host itself (host-gateway),
# where nginx terminates TLS with the same certificates, so presigned storage
# URLs (signed for the public host) and any self-call work from inside too.
# Not the LAN address: the host moved from 192.168.100.197 to .101.245 on
# 2026-10-01 and every self-call (the app and storage probes, server-side S3)
# went unreachable for 17 days.
x-internal-hosts: &internal-hosts
  - 'storage.nexopm.com:host-gateway'
  - 'nexopm.com:host-gateway'

x-public-env: &public-env
  NEXT_PUBLIC_URL: https://nexopm.com
  BETTER_AUTH_URL: https://nexopm.com
  NEXT_PUBLIC_REALTIME_URL: wss://nexopm.com/realtime

# The web app runs as seven identical instances behind nginx's `nexo_app`
# upstream (least_conn over 127.0.0.1:3001-3007): one Node process saturates
# a single core at ~45 req/s, and the host has six physical cores (12 vCPU,
# 12 GB). With five instances the host sat ~50% idle at 1,600 users while every
# instance was pinned at one core (load-snapshot, 2026-10-25), so two more fit
# in the spare threads. Sessions live in Postgres and every rate limit in
# Redis, so any instance can serve any request. Each settles around 1.1 GB of
# RSS under load, so every container has a memory ceiling: seven of them must
# not be able to take the host's 12 GB (the database, Redis and nginx live
# there too). Hitting it restarts one container instead of waking the kernel's
# OOM killer on the whole machine. The V8 heap is deliberately NOT capped:
# --max-old-space-size=768 cut RSS to 470 MB but raised the CPU per request by
# ~70% at the same traffic (GC working against the cap), which cancelled the
# two extra instances (k6 1,600 users, 2026-10-25).
x-app: &app
  image: ghcr.io/castrogusttavo/nexo:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *public-env
    # A bigger young generation means fewer scavenges for a server that
    # allocates a lot per request: GC was 11% of an instance's busy time at
    # 2,400 users (CPU profile, 2026-10-25).
    NODE_OPTIONS: --max-semi-space-size=64
  mem_limit: 1500m
  extra_hosts: *internal-hosts
  volumes:
    - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
  dns:
    - 8.8.8.8
    - 8.8.4.4
  networks:
    - app-network
  # The CD replaces the instances one at a time and waits for this before
  # moving to the next, so nginx always has six serving.
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  # Loopback only: nginx is the public entry point.
  nexo-app-1:
    <<: *app
    container_name: nexo-app-1
    ports:
      - "127.0.0.1:3001:3000"

  nexo-app-2:
    <<: *app
    container_name: nexo-app-2
    ports:
      - "127.0.0.1:3002:3000"

  nexo-app-3:
    <<: *app
    container_name: nexo-app-3
    ports:
      - "127.0.0.1:3003:3000"

  nexo-app-4:
    <<: *app
    container_name: nexo-app-4
    ports:
      - "127.0.0.1:3004:3000"

  nexo-app-5:
    <<: *app
    container_name: nexo-app-5
    ports:
      - "127.0.0.1:3005:3000"

  nexo-app-6:
    <<: *app
    container_name: nexo-app-6
    ports:
      - "127.0.0.1:3006:3000"

  nexo-app-7:
    <<: *app
    container_name: nexo-app-7
    ports:
      - "127.0.0.1:3007:3000"

  nexo-worker:
    image: ghcr.io/castrogusttavo/nexo:latest
    container_name: nexo-worker
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env
    environment: *public-env
    extra_hosts: *internal-hosts
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  nexo-realtime:
    image: ghcr.io/castrogusttavo/nexo:latest
    container_name: nexo-realtime
    restart: unless-stopped
    command: ["node", "dist/realtime.cjs"]
    # Loopback only: the public entry point is nginx's /realtime location.
    ports:
      - "127.0.0.1:1234:1234"
    env_file:
      - .env
    environment: *public-env
    extra_hosts: *internal-hosts
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: nexo_default
