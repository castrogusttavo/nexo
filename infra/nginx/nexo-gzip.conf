# Source of truth for /etc/nginx/conf.d/nexo-gzip.conf on the production host,
# copied from the server on 2026-10-18. Edit here, then install it there.
# Compression for responses proxied from the app (added 2026-10-16). The app
# runs with compress: false: gzipping in the Node process cost more CPU than
# serving a prerendered page. nginx.conf only had "gzip on", which covers
# text/html from local files but not proxied responses (gzip_proxied off).
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml;
