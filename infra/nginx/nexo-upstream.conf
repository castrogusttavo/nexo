# Source of truth for /etc/nginx/conf.d/nexo-upstream.conf on the production host,
# copied from the server on 2026-10-18. Edit here, then install it there.
# Web app instances (infra/app.yml: nexo-app-1..7, loopback only), added
# 2026-10-16, grown from five to seven on 2026-10-25.
# least_conn sends each request to the instance with the fewest open
# connections, which evens out cheap API calls and heavy page renders.
# An instance that fails 3 times in 10s leaves the rotation for 10s, so the
# CD can replace them one at a time without errors reaching users.
upstream nexo_app {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3004 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3006 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3007 max_fails=3 fail_timeout=10s;
}
