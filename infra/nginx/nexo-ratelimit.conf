# Source of truth for /etc/nginx/conf.d/nexo-ratelimit.conf on the production host,
# copied from the server on 2026-10-18. Edit here, then install it there.
# Rate-limit zones shared by the Nexo sites (moved out of the per-site
# file on 2026-09-19 so several server blocks can use them).

map_hash_bucket_size 128; # the 64-char token key does not fit the default 64

# Load-test bypass (2026-10-15, replaces the 2026-10-03 per-IP exemption).
# A request carrying the secret X-Load-Test header (GitHub secret
# LOAD_TEST_TOKEN, copy in /root/nexo-load-test-token) is not counted by
# limit_req: an empty key is skipped. Rotate by changing both.
map $http_x_load_test $load_test {
    default 0;
    "__LOAD_TEST_TOKEN__" 1; # real value: /root/nexo-load-test-token, never committed
}
map $load_test $limit_key {
    0 $binary_remote_addr;
    1 "";
}

# Zone names keep the _lt suffix from 2026-10-03: nginx refuses to change the
# key of an existing zone on reload ([emerg] in error.log while systemctl
# still reports success), so renaming them back would need a restart.
limit_req_zone $limit_key zone=global_lt:10m rate=30r/s;
limit_req_zone $limit_key zone=api_lt:10m rate=20r/s;
limit_req_zone $limit_key zone=auth_lt:10m rate=60r/m;
limit_req_zone $limit_key zone=upload_lt:10m rate=10r/m;

# The load test forwards its own X-Forwarded-For on /api/auth/ so each k6 VU
# keeps a distinct client IP; everyone else gets the socket IP appended, which
# the app reads as the rightmost untrusted hop. Only the first entry is kept:
# since 2026-10-17 Cloudflare appends the runner's address after the VU's, and
# the app would otherwise put every VU in the runner's sign-in bucket.
map "$load_test:$http_x_forwarded_for" $lt_xff {
    "~^1:(?<lt_fwd>[^,]+)" $lt_fwd;
    default $proxy_add_x_forwarded_for;
}
