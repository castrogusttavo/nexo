worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream nexo_backend {
    least_conn;
    server nexo-app-1:3000 max_fails=3 fail_timeout=10s;
    server nexo-app-2:3000 max_fails=3 fail_timeout=10s;
    server nexo-app-3:3000 max_fails=3 fail_timeout=10s;
    server nexo-app-4:3000 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://nexo_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_504;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }
}
