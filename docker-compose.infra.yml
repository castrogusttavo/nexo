services:
  nexo-db:
    image: postgres:17-alpine
    container_name: nexo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-redis:
    image: bitnami/redis:latest
    container_name: nexo-redis
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "yes"
      REDIS_TLS_PORT_NUMBER: 6379
      REDIS_PORT_NUMBER: 0
      REDIS_TLS_CERT_FILE: /opt/bitnami/redis/certs/redis.crt
      REDIS_TLS_KEY_FILE: /opt/bitnami/redis/certs/redis.key
      REDIS_TLS_CA_FILE: /opt/bitnami/redis/certs/ca.crt
      REDIS_TLS_AUTH_CLIENTS: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/bitnami/redis/data
      - ./redis-tls:/opt/bitnami/redis/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -a $${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-storage:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: nexo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000" # API
      - "127.0.0.1:9001:9001" # Console Web
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
  redis-master-data:
  rabbitmqdata:
  miniodata:

secrets:
  hugeicons_token:
    environment: HUGEICONS_TOKEN

networks:
  app-network:
    name: nexo_default
