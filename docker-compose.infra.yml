services:
  nexo-db:
    image: postgres:17-alpine
    container_name: nexo-db-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-redis-master:
    image: bitnami/redis:latest
    container_name: nexo-redis-master
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-redis-replica:
    image: bitnami/redis:latest
    container_name: nexo-redis-replica
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: slave
      REDIS_MASTER_HOST: nexo-redis-master
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-replica-data:/bitnami/redis/data
    depends_on:
      nexo-redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: nexo-sentinel-1
    restart: unless-stopped
    environment:
      REDIS_MASTER_HOST: nexo-redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_NAME:-mymaster}
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: 5000
      REDIS_SENTINEL_QUORUM: 2
    ports:
      - "26379:26379"
    depends_on:
      nexo-redis-master:
        condition: service_healthy
      nexo-redis-replica:
        condition: service_healthy
    networks:
      - app-network

  nexo-sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: nexo-sentinel-2
    restart: unless-stopped
    environment:
      REDIS_MASTER_HOST: nexo-redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_NAME:-mymaster}
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: 5000
      REDIS_SENTINEL_QUORUM: 2
    depends_on:
      nexo-redis-master:
        condition: service_healthy
      nexo-redis-replica:
        condition: service_healthy
    networks:
      - app-network

  nexo-sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: nexo-sentinel-3
    restart: unless-stopped
    environment:
      REDIS_MASTER_HOST: nexo-redis-master
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_NAME:-mymaster}
      REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS: 5000
      REDIS_SENTINEL_QUORUM: 2
    depends_on:
      nexo-redis-master:
        condition: service_healthy
      nexo-redis-replica:
        condition: service_healthy
    networks:
      - app-network

  nexo-queue:
    image: rabbitmq:4-management-alpine
    container_name: nexo-mq-1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5656:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-storage:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: nexo-minio-1
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console Web
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
  redis-master-data:
  redis-replica-data:
  rabbitmqdata:
  miniodata:

networks:
  app-network:
    name: nexo_default
