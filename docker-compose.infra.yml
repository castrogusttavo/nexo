services:
  nexo-db:
    image: postgres:17-alpine
    container_name: nexo-db
    restart: unless-stopped
    # wal_level=replica e max_wal_senders>0 (precisam pra streaming
    # replication) já são o default do postgres:17-alpine sem nenhum
    # override — confirmado com `SHOW wal_level` no container já rodando.
    # REPLICATOR_PASSWORD + o mount abaixo só têm efeito num init novo
    # (volume vazio); num nexo-db que já tem dado, o equivalente
    # (CREATE ROLE + linha em pg_hba.conf + pg_reload_conf()) precisa ser
    # aplicado manualmente uma vez — não requer restart.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-db-replica:
    # Réplica de leitura em streaming replication — clona o nexo-db via
    # pg_basebackup no primeiro start (entrypoint-replica.sh). Volume
    # próprio, não compartilha dado com o nexo-db.
    image: postgres:17-alpine
    container_name: nexo-db-replica
    restart: unless-stopped
    entrypoint: ["/entrypoint-replica.sh"]
    environment:
      PRIMARY_HOST: nexo-db
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5434:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres-replica/entrypoint-replica.sh:/entrypoint-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  nexo-redis:
    # Pinned to the last working bitnami/redis latest (2026-05-11, Redis 8.6.3).
    # The newer hardened "Bitnami Secure Images" latest crash-loops on TLS setup
    # (chmod redis.conf: Operation not permitted). Versioned tags were removed
    # from Docker Hub, so we pin by digest. Do not change to :latest.
    #
    # Digest verified: linux/amd64 manifest of bitnami/redis@sha256:1347d526...
    #   org.opencontainers.image.version=8.6.3
    #   org.opencontainers.image.created=2026-05-11T14:42:18Z
    #
    # To bump this digest in the future:
    #   1. Monitor https://hub.docker.com/r/bitnami/redis/tags or Bitnami release notes
    #      for a patched build that restores TLS compatibility.
    #   2. Find the new digest:
    #        docker pull bitnami/redis:<candidate-tag> --quiet
    #        docker inspect bitnami/redis:<candidate-tag> --format '{{index .RepoDigests 0}}'
    #      or: skopeo inspect --raw docker://bitnami/redis:<tag> | sha256sum
    #   3. Replace the sha256 below with the new digest.
    #   4. Validate before committing:
    #        pnpm infra                              # starts containers
    #        pnpm vitest --project integration src/lib/__tests__/redis-tls.smoke.test.ts
    #        docker compose -f docker-compose.infra.yml logs nexo-redis | grep -i tls
    #   5. Run CI — do NOT revert to :latest.
    image: bitnami/redis@sha256:1347d526ecec0c6537e99eac09e7c3405c21664f6044ff60e78b0898da37abd2
    container_name: nexo-redis
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "yes"
      REDIS_TLS_PORT_NUMBER: 6379
      REDIS_PORT_NUMBER: 0
      REDIS_TLS_CERT_FILE: /opt/bitnami/redis/certs/redis.crt
      REDIS_TLS_KEY_FILE: /opt/bitnami/redis/certs/redis.key
      REDIS_TLS_CA_FILE: /opt/bitnami/redis/certs/ca.crt
      REDIS_TLS_AUTH_CLIENTS: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/bitnami/redis/data
      - ./redis-tls:/opt/bitnami/redis/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /opt/bitnami/redis/certs/ca.crt -a $${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-storage:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: nexo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000" # API
      - "127.0.0.1:9001:9001" # Console Web
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  nexo-pgbouncer:
    # Pooling de transação na frente do nexo-db — não substitui o Postgres,
    # só reduz conexões reais nele. Serviço aditivo: não muda config nem
    # dados do nexo-db existente, só se junta na mesma rede.
    #
    # bitnami/pgbouncer não tem mais tag pública puxável (mesma migração
    # pra "Secure Images" já documentada no nexo-redis acima, só que sem
    # fallback por digest pra esse aqui) — usando edoburu/pgbouncer em vez
    # disso, imagem mantida ativamente, tags reais no Docker Hub.
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: nexo-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: nexo-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      nexo-db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:
  pgdata-replica:
  redis-master-data:
  rabbitmqdata:
  miniodata:

secrets:
  hugeicons_token:
    environment: HUGEICONS_TOKEN

networks:
  app-network:
    name: nexo_default
